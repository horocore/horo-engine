sonar.projectKey=horocore_horo-engine
sonar.organization=horocore
sonar.sourceEncoding=UTF-8

# Keep the repository-level scanner pointed at the active tree only.
# deprecated/ is a ghost zone used only as migration reference for old source;
# Sonar must not index, analyze, or compute coverage for anything under it.
sonar.sources=.
sonar.exclusions=deprecated/**,build/**,cmake-build-debug/**,venv/**,.venv/**,.git/**,.hermes/**,.idea/**,.vscode/**,.cursor/**,.openclaw/**,.pytest_cache/**,bw-output/**,vendor/**,docs/**,.sonar/**,.cmake/**,_deps/**,src/application/project_migrations/definitions/**
sonar.coverage.exclusions=deprecated/**,tests/**,build/**,cmake-build-debug/**,vendor/**,apps/HoroEditor/app/HoroEditorApp.cpp,apps/horo-engine/main.cpp
sonar.cpd.exclusions=deprecated/**,vendor/**
sonar.test.exclusions=deprecated/**

# Navigation bake work may execute foreign provider callbacks that violate the C++ exception contract.
# The coordinator must contain non-standard exceptions so child draining and terminal publication still run.
sonar.issue.ignore.multicriteria=navigationBakeForeignException
sonar.issue.ignore.multicriteria.navigationBakeForeignException.ruleKey=cpp:S1181
sonar.issue.ignore.multicriteria.navigationBakeForeignException.resourceKey=src/runtime/navigation/runtime/NavigationBakeJobs.cpp

# Active tests will be wired here as they are migrated out of deprecated/.
sonar.tests=tests
sonar.test.inclusions=tests/**
