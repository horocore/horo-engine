name: Extension ABI Windows

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/extension-abi-windows.yml'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'include/Horo/Extensions/**'
      - 'include/Horo/Assets/AssetImporter.h'
      - 'include/Horo/Platform/DynamicLibrary.h'
      - 'src/CMakeLists.txt'
      - 'src/extensions/**'
      - 'src/platform/windows/DynamicLibrary_Windows.cpp'
      - 'tests/CMakeLists.txt'
      - 'tests/unit/extensions/**'
      - 'tests/integration/extensions/**'
      - 'tests/fixtures/extensions/**'
  pull_request:
    paths:
      - '.github/workflows/extension-abi-windows.yml'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'include/Horo/Extensions/**'
      - 'include/Horo/Assets/AssetImporter.h'
      - 'include/Horo/Platform/DynamicLibrary.h'
      - 'src/CMakeLists.txt'
      - 'src/extensions/**'
      - 'src/platform/windows/DynamicLibrary_Windows.cpp'
      - 'tests/CMakeLists.txt'
      - 'tests/unit/extensions/**'
      - 'tests/integration/extensions/**'
      - 'tests/fixtures/extensions/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Direct sccache uploads follow the same main-only policy as snapshots.
env:
  SCCACHE_GHA_RW_MODE: ${{ github.ref == 'refs/heads/main' && 'READ_WRITE' || 'READ_ONLY' }}

jobs:
  extension-abi-windows:
    name: Extension ABI · Windows / MSVC
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
      - uses: seanmiddleditch/gha-setup-ninja@3b1f8f94a2f8254bd26914c4ab9474d4f0015f67
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.17.0
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        id: dependency_cache
        with:
          path: ${{ github.workspace }}/.cmake/fetchcontent
          key: fetchcontent-extension-abi-windows-${{ hashFiles('**/CMakeLists.txt', 'cmake/**') }}
          restore-keys: fetchcontent-extension-abi-windows-
      - name: Build and qualify real native ABI fixtures
        shell: bash
        run: |
          cmake -S . -B build/extension-abi-windows -G Ninja \
            -DBUILD_TESTING=ON \
            -DHORO_BUILD_EDITOR_GUI=OFF \
            -DHORO_BUILD_RENDER_OPENGL=OFF \
            -DHORO_ENABLE_OPENTELEMETRY=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded
          cmake --build build/extension-abi-windows --target HoroExtensionManagerTests --parallel 2
          ctest --test-dir build/extension-abi-windows \
            -R '^(HoroExtensionManagerTests|HoroExtensionAbiConformanceCli)' \
            --output-on-failure --timeout 60
        env:
          CC: cl
          CXX: cl
          FETCHCONTENT_BASE_DIR: ${{ github.workspace }}/.cmake/fetchcontent
          SCCACHE_GHA_ENABLED: 'true'
          SCCACHE_IGNORE_SERVER_IO_ERROR: '1'

      - name: Save dependency cache on main
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.dependency_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ github.workspace }}/.cmake/fetchcontent
          key: ${{ steps.dependency_cache.outputs.cache-primary-key }}
