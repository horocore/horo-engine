name: Save Path Windows

on:
  pull_request:
    paths:
      - '.github/workflows/save-path-windows.yml'
      - 'cmake/**'
      - 'include/Horo/Runtime/Save/**'
      - 'src/runtime/save/**'
      - 'tests/unit/runtime/save/**'
      - 'src/CMakeLists.txt'
  workflow_dispatch:

jobs:
  save-path-windows:
    name: Save Path · Windows / MSVC
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756

      - uses: seanmiddleditch/gha-setup-ninja@3b1f8f94a2f8254bd26914c4ab9474d4f0015f67

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.17.0

      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ github.workspace }}/.cmake/fetchcontent
          key: fetchcontent-save-path-windows-${{ hashFiles('**/CMakeLists.txt', 'cmake/**') }}
          restore-keys: fetchcontent-save-path-windows-

      - name: Build and test save path containment
        shell: bash
        run: |
          cmake -S . -B build/save-path-windows -G Ninja \
            -DBUILD_TESTING=ON \
            -DHORO_BUILD_EDITOR_GUI=OFF \
            -DHORO_BUILD_RENDER_OPENGL=OFF \
            -DHORO_ENABLE_OPENTELEMETRY=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded
          cmake --build build/save-path-windows --target HoroRuntimeSaveRootResolverTests --parallel 2
          ctest --test-dir build/save-path-windows -R '^HoroRuntimeSaveRootResolverTests::' --output-on-failure
        env:
          CC: cl
          CXX: cl
          FETCHCONTENT_BASE_DIR: ${{ github.workspace }}/.cmake/fetchcontent
          SCCACHE_GHA_ENABLED: 'true'
          SCCACHE_IGNORE_SERVER_IO_ERROR: '1'
