name: Compiler cache retention

on:
  workflow_run:
    workflows: [CI, SonarCloud]
    branches: [main]
    types: [completed]
  # Also reclaim duplicates while a long main build is still running.
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Report superseded compiler snapshots without deleting them
        type: boolean
        default: true

permissions:
  contents: read
  actions: write

concurrency:
  group: compiler-cache-retention
  cancel-in-progress: false

jobs:
  retain:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # This privileged workflow uses only reviewed default-branch code, never
      # the triggering run's checkout, artifacts or pull request inputs.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          CACHE_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        with:
          script: |
            const { retainCompilerCaches } = require('./.github/scripts/retain_compiler_caches.js');
            await retainCompilerCaches({ github, context, core, dryRun: process.env.CACHE_DRY_RUN === 'true' });
