          @'
          """Exact evidence accounting embedded verbatim in the workflow candidate."""
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import sys
          from defusedxml import ElementTree as ET

          EXPECTED = {
              'HoroWorldStreamingTests': (436, '87810fc124109888aa8f5a2564b043efc33f93b63eaffd9f71541e6b6999a776', 'world'),
              'HoroTerrainAuthoringTests': (20, 'fc969ad408dbfdaa459685c1cad81f2ae1c9f06ae612d08c546b759e5bbe4a07', 'terrain'),
          }
          FIX1 = (4, '902acbb5c90eed9cd97461491a345637895d97408f747e3c88e816d462ec6c74')

          def require(condition, message):
              if not condition:
                  raise ValueError(message)

          def identities(names, expected):
              require(len(names) == len(set(names)) == expected[0], 'missing, extra, duplicate or zero test identities')
              digest = hashlib.sha256(('\n'.join(sorted(names)) + '\n').encode()).hexdigest()
              require(digest == expected[1], 'exact source-reviewed test identity set changed')
              return digest

          def junit(path, expected, ctest):
              root = ET.parse(path).getroot()
              cases = list(root.iter('testcase'))
              names = [case.attrib['name'] for case in cases]
              digest = identities(names, expected)
              for suite in root.iter('testsuite'):
                  for key in ['failures', 'errors', 'skipped', 'disabled']:
                      require(int(suite.get(key, '0')) == 0, f'{path.name}: nonzero {key}')
              for case in cases:
                  require(case.get('status') == 'run', f'{case.get("name")}: not actually run')
                  require(not any(node.tag in ['failure', 'error', 'skipped'] for node in case.iter()), 'failed or skipped case')
                  output = case.findtext('system-out', '')
                  require(not re.search(r'SKIPPED|FAILED - but was ok|\b[1-9][0-9]* skipped\b', output), 'Catch skip or tolerated failure')
              if ctest:
                  require(root.tag == 'testsuite' and int(root.attrib['tests']) == len(cases), 'CTest JUnit count mismatch')
              else:
                  # Catch JUnit suite tests counts assertions, not testcase elements.
                  require(sum(int(suite.get('tests', '0')) for suite in root.iter('testsuite')) > 0, 'no Catch assertions')
                  filters = [node.get('value') for node in root.iter('property') if node.get('name') == 'filters']
                  require(filters == ['[fix1]'], 'focused filter changed')
              return {'testcase_count': len(cases), 'identity_sha256': digest,
                      'suite_test_attributes': [suite.get('tests') for suite in root.iter('testsuite')],
                      'failures_errors_skips_disabled': 0}

          def suite(folder, target, expected):
              count, digest, stem = expected
              listing = json.loads((folder / f'{stem}-ctest-list.json').read_text(encoding='utf-8-sig'))
              require(listing['kind'] == 'ctestInfo' and listing['version']['major'] == 1, 'unexpected CTest JSON schema')
              tests = listing['tests']
              identities([test['name'] for test in tests], (count, digest))
              executable = (Path.cwd() / 'build/m3-probe/tests' / (target + '.exe')).resolve()
              for test in tests:
                  require(test['name'].startswith(target + '::'), 'foreign CTest registration')
                  command = test['command']
                  escaped = test['name'][len(target) + 2:]
                  for char in ['\\', ',', '[', ']', ';']:
                      escaped = escaped.replace(char, '\\' + char)
                  require(len(command) == 2 and Path(command[0]).resolve() == executable and command[1] == escaped,
                          'wrong executable, filtered subset, wrapper or extra Catch arguments')
                  properties = test.get('properties', [])
                  skip_codes = [prop['value'] for prop in properties if prop['name'] == 'SKIP_RETURN_CODE']
                  # Pinned Catch discovery declares code 4; JUnit/full logs must still prove zero actual skips.
                  require(len(skip_codes) == 1 and type(skip_codes[0]) is int and skip_codes[0] == 4,
                          'missing, duplicate or unexpected Catch skip return code')
                  for prop in properties:
                      require(prop['name'] not in ['DISABLED', 'WILL_FAIL', 'SKIP_REGULAR_EXPRESSION',
                                                    'PASS_REGULAR_EXPRESSION'], 'skip or failure-inversion property')
              log = (folder / f'{stem}-ctest-LastTest.log').read_text(encoding='utf-8-sig')
              require(not re.search(r'SKIPPED|FAILED - but was ok|\b[1-9][0-9]* skipped\b', log), 'Catch skip or tolerated failure in full log')
              result = junit(folder / f'{stem}-ctest.xml', (count, digest), True)
              result['executable_sha256'] = hashlib.sha256(executable.read_bytes()).hexdigest()
              return result

          def main():
              folder = Path(os.environ['RUNNER_TEMP']) / 'm3-diagnostic'
              folder.mkdir(exist_ok=True)
              report = {}
              checks = {target: lambda target=target, expected=expected: suite(folder, target, expected)
                        for target, expected in EXPECTED.items()}
              checks['focused_fix1'] = lambda: junit(folder / 'world-red.xml', FIX1, False)
              for name, check in checks.items():
                  try:
                      report[name] = {'status': 'success', **check()}
                  except Exception as error:
                      report[name] = {'status': 'failure', 'error': str(error)}
              (folder / 'evidence-validation.json').write_text(json.dumps(report, indent=2), encoding='utf-8')
              print(json.dumps(report, indent=2))
              return int(any(result['status'] != 'success' for result in report.values()))

          if __name__ == '__main__':
              sys.exit(main())
          '@ | python -
          exit $LASTEXITCODE
