      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: test-results-${{ runner.os }}
          path: |
            build/ci*/ctest.xml
            build/ci-metal/tests/MetalPreparationFixture.metallib
            ${{ runner.temp }}/ui-paint-msl/
            ${{ runner.temp }}/ui-paint-offline/
            build/ci-metal/Testing/Temporary/LastTest.log
            build/ci-audio-release/mcp-ctest.xml
            build/ci-audio-release/restore-ctest.xml
            build/ci-audio-release/collision-allocation-ctest.xml
            build/ci-audio-release/collision-allocation-discovery.json
            build/ci-audio-release/collision-allocation-regex.txt
            build/ci-audio-release/extension-allocation-ctest.xml
            build/ci-audio-release/tests/HoroWorkspaceLayoutPersistenceTests.exe
