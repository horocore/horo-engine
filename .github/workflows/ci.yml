          $folder = Join-Path $env:RUNNER_TEMP 'm3-diagnostic'
          & ctest --test-dir build/m3-probe -R '^HoroWorldStreamingTests::' --show-only=json-v1 | Set-Content -Encoding utf8 (Join-Path $folder 'world-ctest-list.json')
