name: M3 Windows regression diagnostic
run-name: M3 Windows diagnostic ${{ github.sha }}
on:
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: m3-windows-diagnostic-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows-regressions:
    name: Windows MSVC - known RED diagnostic
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/test/HORO-1520_m3_windows_regressions'
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout diagnostic commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Setup existing Windows build tools
        uses: ./.github/actions/setup-build-tools
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          architecture: x64
      - name: Capture exact source provenance
        run: |-
          @'
          import hashlib, json, os, pathlib, platform, subprocess
          root = pathlib.Path.cwd()
          names = ['cmake/HoroPublicHeaderOwnership.cmake', 'include/Horo/Editor/TerrainBrushTools.h', 'include/Horo/WorldStreaming/StreamingCellDirection.h', 'include/Horo/WorldStreaming/StreamingFeatureBudgetReservations.h', 'src/CMakeLists.txt', 'src/editor/terrain/TerrainBrushAdmission.h', 'src/editor/terrain/TerrainBrushTools.cpp', 'src/runtime/world_streaming/StreamingCellDirection.cpp', 'tests/CMakeLists.txt', 'tests/unit/editor/TerrainBrushAdmissionCompileTests.cpp', 'tests/unit/editor/TerrainBrushToolsTests.cpp', 'tests/unit/runtime/world_streaming/StreamingDirectionFinalizationTestSupport.h', 'tests/unit/runtime/world_streaming/StreamingDirectionFinalizationTests.cpp', 'tests/unit/runtime/world_streaming/StreamingFeatureBudgetReservationsTests.cpp', '.github/workflows/ci.yml']
          report = {
              'git_sha': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'event_sha': os.environ['GITHUB_SHA'],
              'ref': os.environ['GITHUB_REF'],
              'platform': platform.platform(),
              'cpu_count': os.cpu_count(),
              'source_sha256': {name: hashlib.sha256((root/name).read_bytes()).hexdigest() for name in names},
              'scope': 'Windows-only diagnostic; known RED permitted by user; not a merge-ready PR',
          }
          assert report['git_sha'] == report['event_sha']
          folder = pathlib.Path(os.environ['RUNNER_TEMP']) / 'm3-diagnostic'
          folder.mkdir(exist_ok=True)
          (folder/'provenance.json').write_text(json.dumps(report, indent=2), encoding='utf-8')
          print(json.dumps(report, indent=2))
          '@ | python -
      - name: Install pinned diagnostic CMake and test dependencies
        run: |
          $requirements = Join-Path $env:RUNNER_TEMP 'cmake-diagnostic.txt'
          'cmake==3.31.6 --hash=sha256:bbaed969cef3c427f4f17591feb28db4ae595e3a4bbd45cb35522cee14df6a32' | Set-Content -Encoding ascii $requirements
          python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r $requirements
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --disable-pip-version-check --only-binary=:all: pytest==8.4.2 defusedxml==0.7.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --version
          ninja --version
      - name: Configure exact headless composition
        id: configure
        run: |
          $ErrorActionPreference = 'Continue'
          $folder = Join-Path $env:RUNNER_TEMP 'm3-diagnostic'
          $pythonPath = (Get-Command python).Source
          $arguments = @('-S', '.', '-B', 'build/m3-probe', '-G', 'Ninja',
              '-DCMAKE_BUILD_TYPE=Debug', '-DBUILD_TESTING=ON',
              '-DHORO_BUILD_EDITOR_GUI=OFF', '-DHORO_BUILD_RENDER_OPENGL=OFF',
              '-DHORO_BUILD_RENDER_METAL=OFF', '-DHORO_BUILD_INPUT_SDL3=OFF',
              '-DHORO_BUILD_AUDIO_SDL3=OFF', '-DHORO_BUILD_PHYSICS_NATIVE=OFF',
              '-DHORO_BUILD_NAVIGATION_RECAST_DETOUR=OFF', '-DHORO_BUILD_EXAMPLES=OFF',
              '-DHORO_ENABLE_OPENTELEMETRY=OFF',
              '-DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON', '-DCMAKE_EXPORT_COMPILE_COMMANDS=ON',
              '-DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded',
              '-DCMAKE_C_COMPILER_LAUNCHER=', '-DCMAKE_CXX_COMPILER_LAUNCHER=',
              "-DPython3_EXECUTABLE=$pythonPath")
          & cmake @arguments 2>&1 | Tee-Object -FilePath (Join-Path $folder 'configure.log')
          exit $LASTEXITCODE
      - name: Build World regression executable
        id: world_build
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          $log = Join-Path $env:RUNNER_TEMP 'm3-diagnostic/world-build.log'
          & cmake --build build/m3-probe --target HoroWorldStreamingTests --parallel 2 2>&1 | Tee-Object -FilePath $log
          exit $LASTEXITCODE
      - name: Execute World exhaustion regressions - RED expected initially
        id: world_red
        if: always() && steps.world_build.outcome == 'success'
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          $folder = Join-Path $env:RUNNER_TEMP 'm3-diagnostic'
          Get-FileHash build/m3-probe/tests/HoroWorldStreamingTests.exe -Algorithm SHA256 | Format-List
          & ./build/m3-probe/tests/HoroWorldStreamingTests.exe '[fix1]' --reporter junit --out (Join-Path $folder 'world-red.xml') 2>&1 | Tee-Object -FilePath (Join-Path $folder 'world-red.log')
          exit $LASTEXITCODE
      - name: Compile production-used Terrain arithmetic regressions - RED expected initially
        id: terrain_red
        if: always() && steps.configure.outcome == 'success'
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          $log = Join-Path $env:RUNNER_TEMP 'm3-diagnostic/terrain-compiler-red.log'
          & cmake --build build/m3-probe --target tests/CMakeFiles/HoroTerrainAuthoringTests.dir/unit/editor/TerrainBrushAdmissionCompileTests.cpp.obj --parallel 1 2>&1 | Tee-Object -FilePath $log
          exit $LASTEXITCODE
      - name: Record honest step outcomes
        if: always()
        run: |
          $result = @{ configure = '${{ steps.configure.outcome }}'; world_build = '${{ steps.world_build.outcome }}'; world_tests = '${{ steps.world_red.outcome }}'; terrain_compilation = '${{ steps.terrain_red.outcome }}' }
          $folder = Join-Path $env:RUNNER_TEMP 'm3-diagnostic'
          New-Item -ItemType Directory -Force -Path $folder | Out-Null
          $result | ConvertTo-Json | Set-Content -Encoding utf8 (Join-Path $folder 'outcomes.json')
          $result | ConvertTo-Json
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m3-windows-diagnostic-${{ github.sha }}
          path: |-
            ${{ runner.temp }}/m3-diagnostic/
            build/m3-probe/compile_commands.json
          if-no-files-found: error
          retention-days: 7
      - name: Keep RED failures visible - never label expected failures GREEN
        if: always()
        run: |
          if ('${{ steps.configure.outcome }}' -ne 'success' -or '${{ steps.world_build.outcome }}' -ne 'success' -or '${{ steps.world_red.outcome }}' -ne 'success' -or '${{ steps.terrain_red.outcome }}' -ne 'success') { exit 1 }
