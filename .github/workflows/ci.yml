name: CI

on:
  workflow_dispatch:

permissions: {}

jobs:
  metal-host-facts:
    name: MetalHostFactsDiagnostic (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-14, macos-26, macos-26-intel]
    steps:
      - name: Compile and report actual Metal host facts (diagnostic only)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/metal-host-probe"
          cd "$RUNNER_TEMP/metal-host-probe"
          cat > probe.mm <<'OBJC'
          #import <Foundation/Foundation.h>
          #import <Metal/Metal.h>
          #include <sys/utsname.h>
          #include <sys/sysctl.h>
          #include <stdio.h>

          static NSString *CompileArch() {
          #if defined(__arm64__) || defined(__aarch64__)
              return @"arm64";
          #elif defined(__x86_64__)
              return @"x86_64";
          #else
              return @"unsupported";
          #endif
          }
          static NSDictionary *Facts(id<MTLDevice> device) {
              BOOL apple7 = [device supportsFamily:MTLGPUFamilyApple7];
              BOOL mac2 = [device supportsFamily:MTLGPUFamilyMac2];
              NSOperatingSystemVersion os = NSProcessInfo.processInfo.operatingSystemVersion;
              BOOL familyMatch = ([CompileArch() isEqualToString:@"arm64"] && apple7) ||
                                 ([CompileArch() isEqualToString:@"x86_64"] && mac2);
              return @{@"name": device.name ?: @"", @"registryID": [NSString stringWithFormat:@"%016llx", (unsigned long long)device.registryID],
                       @"supportsApple7": @(apple7), @"supportsMac2": @(mac2),
                       @"lowPower": @(device.lowPower), @"removable": @(device.removable),
                       @"unifiedMemory": @(device.hasUnifiedMemory), @"headless": @(device.headless),
                       @"baselineMatch": @(os.majorVersion >= 14 && familyMatch)};
          }
          int main() {
              @autoreleasepool {
                  struct utsname host = {};
                  int unameResult = uname(&host);
                  int translated = 0;
                  size_t translatedSize = sizeof(translated);
                  int translationQuery = sysctlbyname("sysctl.proc_translated", &translated, &translatedSize, NULL, 0);
                  NSArray<id<MTLDevice>> *devices = MTLCopyAllDevices();
                  id<MTLDevice> defaultDevice = MTLCreateSystemDefaultDevice();
                  NSMutableArray *all = [NSMutableArray array];
                  for (id<MTLDevice> device in devices) [all addObject:Facts(device)];
                  NSOperatingSystemVersion os = NSProcessInfo.processInfo.operatingSystemVersion;
                  NSDictionary *report = @{
                      @"diagnosticOnly": @YES, @"nativeQualification": @"not_assessed",
                      @"baselinePredicate": @"os.major >= 14 && ((compileArch == arm64 && supportsApple7) || (compileArch == x86_64 && supportsMac2))",
                      @"baselineCaveat": @"Predicate match is not native release qualification; translated, virtual and remote GPUs remain unqualified by ADR-030.",
                      @"os": @{@"version": NSProcessInfo.processInfo.operatingSystemVersionString,
                               @"major": @(os.majorVersion), @"minor": @(os.minorVersion), @"patch": @(os.patchVersion),
                               @"kernelRelease": unameResult == 0 ? [NSString stringWithUTF8String:host.release] : @"unknown"},
                      @"compileArch": CompileArch(), @"processArch": CompileArch(),
                      @"unameMachine": unameResult == 0 ? [NSString stringWithUTF8String:host.machine] : @"unknown",
                      @"translationQueryAvailable": @(translationQuery == 0),
                      @"processTranslated": translationQuery == 0 ? (id)@(translated != 0) : (id)[NSNull null],
                      @"allDevices": all, @"allDevicesCount": @(all.count),
                      @"defaultDevice": defaultDevice ? (id)Facts(defaultDevice) : (id)[NSNull null]
                  };
                  NSError *error = nil;
                  NSData *data = [NSJSONSerialization dataWithJSONObject:report options:NSJSONWritingPrettyPrinted | NSJSONWritingSortedKeys error:&error];
                  if (!data) { fprintf(stderr, "JSON serialization failed: %s\n", error.localizedDescription.UTF8String); return 1; }
                  fwrite(data.bytes, 1, data.length, stdout);
                  fputc('\n', stdout);
              }
              return 0;
          }
          OBJC
          xcrun --sdk macosx clang++ -std=c++17 -fobjc-arc -mmacosx-version-min=14.0 probe.mm -framework Metal -framework Foundation -o probe
          ./probe | tee metal-host-facts.json
      - name: Preserve diagnostic JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metal-host-facts-${{ matrix.runner }}
          path: ${{ runner.temp }}/metal-host-probe/metal-host-facts.json
          if-no-files-found: warn
          retention-days: 7
