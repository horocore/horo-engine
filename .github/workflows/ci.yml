name: CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Format & Tooling Check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Tooling
        run: "pip install --no-cache-dir --only-binary=:all: pytest==8.3.4 clang-format==19.1.7"




      - name: Diagnostics Check
        run: python3 scripts/dev.py doctor

      - name: Verify C++ Formatting
        run: python3 scripts/dev.py format --check

      - name: Run Python Runner Tests
        run: pytest tests/python/


  test:
    name: Test · ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    needs: [format]
    timeout-minutes: ${{ matrix.timeout_minutes }}
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux / GCC
            runner: ubuntu-24.04
            timeout_minutes: 25
            cc: gcc
            cxx: g++
            build_dir: build/ci
          - name: macOS / Clang
            runner: macos-latest
            timeout_minutes: 25
            cc: clang
            cxx: clang++
            build_dir: build/ci
          - name: Windows / MSVC
            runner: windows-2022
            # The full MSVC suite consistently reaches the 45-minute job limit after successful compilation.
            timeout_minutes: 60
            cc: cl
            cxx: cl
            build_dir: build/ci

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          if ! sudo apt-get update; then
            sudo rm -f /etc/apt/sources.list.d/azure-cli.list /etc/apt/sources.list.d/microsoft-prod.list
            sudo apt-get update
          fi
          sudo apt-get install -y --no-install-recommends \
            ninja-build \
            libwayland-dev \
            wayland-protocols \
            libxkbcommon-dev \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libxext-dev \
            libxss-dev \
            libxtst-dev \
            libxxf86vm-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev

      - name: Install macOS system dependencies
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Setup MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756

      - name: Setup Ninja on Windows
        if: runner.os == 'Windows'
        uses: seanmiddleditch/gha-setup-ninja@3b1f8f94a2f8254bd26914c4ab9474d4f0015f67

      - name: Setup sccache on Windows
        if: runner.os == 'Windows'
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.17.0

      - name: Restore compiler cache
        if: runner.os != 'Windows'
        uses: hendrikmuhs/ccache-action@33522472633dbd32578e909b315f5ee43ba878ce
        with:
          key: ${{ github.job }}-${{ runner.os }}

      - name: Cache FetchContent dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ github.workspace }}/.cmake/fetchcontent
          key: fetchcontent-${{ runner.os }}-${{ hashFiles('**/CMakeLists.txt', 'cmake/**') }}
          restore-keys: fetchcontent-${{ runner.os }}-

      - name: Toolchain & Environment Diagnostics
        shell: bash
        run: python3 scripts/dev.py doctor

      - name: Build and Test
        id: native_tests
        shell: bash
        run: |
          compiler_cache_args=()
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            compiler_cache_args=(--compiler-launcher sccache --msvc-debug-information-format Embedded)
          fi
          python3 scripts/dev.py test \
            --dir "${{ matrix.build_dir }}" \
            "${compiler_cache_args[@]}" \
            --junit "${{ github.workspace }}/${{ matrix.build_dir }}/test-results/ctest.xml"
          echo "=== test-results directory ==="
          ls -la "${{ github.workspace }}/${{ matrix.build_dir }}/test-results" || true
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
          FETCHCONTENT_BASE_DIR: ${{ github.workspace }}/.cmake/fetchcontent
          HORO_LOG_LEVEL: debug
          SCCACHE_GHA_ENABLED: ${{ runner.os == 'Windows' && 'true' || 'false' }}
          SCCACHE_IGNORE_SERVER_IO_ERROR: ${{ runner.os == 'Windows' && '1' || '0' }}

      - name: Show Windows compiler cache stats
        if: always() && runner.os == 'Windows'
        continue-on-error: true
        shell: bash
        run: '"${SCCACHE_PATH}" --show-stats'
        env:
          SCCACHE_GHA_ENABLED: 'true'

      - name: Publish test results
        if: always() && (steps.native_tests.outcome == 'success' || steps.native_tests.outcome == 'failure')
        uses: mikepenz/action-junit-report@d9f48fc87bc235f7e214acf696ca5abc0a986f16
        with:
          report_paths: ${{ github.workspace }}/${{ matrix.build_dir }}/test-results/ctest.xml
          check_name: Test Results · ${{ matrix.name }}
          fail_on_failure: false
          require_tests: false
          detailed_summary: true
          include_passed: false

      - name: Upload test results
        if: always() && (steps.native_tests.outcome == 'success' || steps.native_tests.outcome == 'failure')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: test-results-${{ runner.os }}
          path: ${{ github.workspace }}/${{ matrix.build_dir }}/test-results/
          retention-days: 14

  navigation-compositions:
    name: Navigation Provider Compositions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Install build tooling
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build

      - name: Cache FetchContent dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ github.workspace }}/.cmake/fetchcontent
          key: navigation-compositions-${{ hashFiles('**/CMakeLists.txt', 'cmake/**') }}

      - name: Build navigation with and without Recast Detour
        shell: bash
        run: |
          for enabled in ON OFF; do
            build_dir="build/navigation-${enabled,,}"
            cmake -S . -B "${build_dir}" -G Ninja \
              -DBUILD_TESTING=OFF \
              -DHORO_BUILD_EDITOR_GUI=OFF \
              -DHORO_BUILD_EXAMPLES=OFF \
              -DHORO_BUILD_NAVIGATION_RECAST_DETOUR="${enabled}"
            cmake --build "${build_dir}" --target \
              HoroNavigationRuntime HoroNavigationNull HoroNavigationRecastDetour
          done
