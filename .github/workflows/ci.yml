          $log = Join-Path $env:RUNNER_TEMP 'm3-diagnostic/terrain-build.log'
          & cmake --build build/m3-probe --target HoroTerrainAuthoringTests --parallel 2 2>&1 | Tee-Object -FilePath $log
          exit $LASTEXITCODE
      - name: Execute complete HoroTerrainAuthoringTests CTest suite
