name: Windows compiler cache benchmark

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: windows-compiler-cache-benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      CC: cl
      CXX: cl
      HORO_COMPILER_LAUNCHER: sccache
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build-tools
      - uses: ./.github/actions/restore-native-cache
        with:
          profile: native-variants-v1
          dependency-profile: native-tests-v1
          mode: Mixed
          max-size: 2G
          compiler-storage: registry
      - name: Configure actual Release object commands
        run: cmake --preset ci-audio-release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Compare cache modes and bounded compiler workers
        timeout-minutes: 8
        run: python3 .github/scripts/benchmark_windows_cache.py
      - name: Preserve benchmark evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-compiler-cache-benchmark
          path: build/windows-cache-benchmark
          if-no-files-found: error
          retention-days: 7
