name: APT hosted runner probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apt-hosted-probe:
    name: Ubuntu26 APT read-only diagnostics
    runs-on: ubuntu-26.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact probe source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Capture installer outcome without invoking dpkg
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/apt-hosted-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/apt-hosted-evidence/checkout-sha.txt"
          started=$SECONDS
          result=0
          bash .github/scripts/install_linux_build_dependencies.sh > "$RUNNER_TEMP/apt-hosted-evidence/installer.log" 2>&1 || result=$?
          printf '%s\n' "$result" > "$RUNNER_TEMP/apt-hosted-evidence/installer-exit.txt"
          printf '%s\n' "$((SECONDS - started))" > "$RUNNER_TEMP/apt-hosted-evidence/installer-elapsed-seconds.txt"
          printf 'Diagnostic capture only. Installer exit=%s; no remediation or native qualification asserted.\n' "$result" >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/apt-hosted-evidence/installer-exit.txt"
      - name: Upload bounded redacted diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: apt-hosted-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/apt-hosted-evidence/
          if-no-files-found: error
          retention-days: 3
          include-hidden-files: false
