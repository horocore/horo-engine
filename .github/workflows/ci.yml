name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:
    inputs:
      save_allocation_diagnostics:
        description: Run bounded Windows Save allocation stack diagnostics
        type: boolean
        required: false
        default: false
      source_allocation_diagnostics:
        description: Run bounded Windows source edit allocation stack diagnostics
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tooling:
    name: Format & Tooling Check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      network: ${{ steps.changes.outputs.network }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Select optional network checks
        id: changes
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const networkChanged = require('./.github/scripts/network_changes.js');
            const selected = await networkChanged({ github, context, core });
            core.info(`Network checks: ${selected ? 'enabled' : 'skipped; no relevant changes'}`);
            core.setOutput('network', selected);

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tooling
        run: >-
          pip install --no-cache-dir --only-binary=:all: pytest==8.3.4 clang-format==19.1.7 defusedxml==0.7.1

      - name: Check C++ formatting
        run: python3 scripts/dev.py format --check

      - name: Test Python tooling
        run: pytest tests/python/

  android-storage:
    name: Android Storage · NDK arm64 API 29
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Select pinned adapter qualification NDK
        shell: bash
        run: |
          set -euo pipefail
          ndk_version=27.3.13750724
          if [[ ! -d "$ANDROID_HOME/ndk/$ndk_version" ]]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk_version"
          fi
          printf 'HORO_STORAGE_NDK=%s\n' "$ANDROID_HOME/ndk/$ndk_version" >> "$GITHUB_ENV"

      - name: Compile native adapter and standalone public header
        shell: bash
        run: |
          set -euo pipefail
          storage_compiler="$HORO_STORAGE_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang++"
          "$storage_compiler" --version
          "$storage_compiler" -std=c++20 -fsyntax-only -Iinclude -Isrc/platform/android src/platform/android/AndroidStorage.cpp
          "$storage_compiler" -std=c++20 -fsyntax-only -Iinclude -x c++ - <<'CPP'
          #include <Horo/Platform/AndroidStorage.h>
          CPP

  vulkan-commands:
    name: Vulkan 1.3 · Linux native commands
    needs: tooling
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CC: gcc
      CXX: g++
      HORO_COMPILER_LAUNCHER: ccache
      VK_DRIVER_FILES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Setup build tools
        uses: ./.github/actions/setup-build-tools
      - name: Restore dependency and compiler caches
        uses: ./.github/actions/restore-native-cache
        with:
          profile: native-tests-v1
          mode: Debug
          max-size: 2G
      - name: Install native Vulkan qualification driver and validation layer
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends libvulkan1 mesa-vulkan-drivers vulkan-tools vulkan-validationlayers
      - name: Record selected native driver provenance
        run: |
          mkdir -p build/vulkan-command-evidence
          git rev-parse HEAD > build/vulkan-command-evidence/checkout.txt
          printf '%s\n' '${{ github.event.pull_request.head.sha || github.sha }}' > build/vulkan-command-evidence/source-head.txt
          dpkg-query -W libvulkan1 mesa-vulkan-drivers vulkan-tools vulkan-validationlayers > build/vulkan-command-evidence/packages.txt
          sha256sum "$VK_DRIVER_FILES" > build/vulkan-command-evidence/icd.sha256
          vulkaninfo --summary > build/vulkan-command-evidence/driver.txt 2>&1
      - name: Configure exact headless Vulkan command composition
        run: |
          set -o pipefail
          cmake --preset ci-linux-debug -B build/ci-vulkan-commands -DBUILD_TESTING=ON \
            -DHORO_BUILD_RENDER_VULKAN=ON -DHORO_BUILD_RENDER_OPENGL=OFF -DHORO_BUILD_RENDER_METAL=OFF \
            -DHORO_BUILD_EDITOR_GUI=OFF -DHORO_ENABLE_GPU_SMOKE_TESTS=ON \
            -DHORO_BUILD_PHYSICS_NATIVE=OFF -DHORO_BUILD_NAVIGATION_RECAST_DETOUR=OFF \
            2>&1 | tee build/vulkan-command-evidence/configure.txt
      - name: Build actual native command owner and common contract consumers
        run: |
          set -o pipefail
          cmake --build build/ci-vulkan-commands --parallel 2 --target HoroRenderVulkanTests \
            HoroVulkanCommandExecutionSmoke HoroRenderGraphTests HoroRenderFrontendTests HoroRenderBackendRegistryTests \
            2>&1 | tee build/vulkan-command-evidence/build.txt
      - name: Run portable contracts and actual installed-driver native commands
        run: |
          set -o pipefail
          ctest --test-dir build/ci-vulkan-commands --output-on-failure --parallel 1 \
            -R '^((HoroRenderVulkanTests|HoroRenderGraphTests|HoroRenderFrontendTests|HoroRenderBackendRegistryTests)(::.+)?|HoroVulkanCommandExecutionSmoke)$' \
            --output-junit ../vulkan-command-evidence/tests.xml \
            2>&1 | tee build/vulkan-command-evidence/test.txt
      - name: Upload native command qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vulkan-command-qualification
          path: |
            build/vulkan-command-evidence/
            build/ci-vulkan-commands/CMakeCache.txt
            build/ci-vulkan-commands/compile_commands.json
          if-no-files-found: warn

  directx-resources:
    name: D3D12 · Windows WARP resources
    needs: tooling
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      CC: cl
      CXX: cl
      HORO_COMPILER_LAUNCHER: sccache
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Setup build tools
        uses: ./.github/actions/setup-build-tools
      - name: Restore dependency and compiler caches
        uses: ./.github/actions/restore-native-cache
        with:
          profile: native-tests-v1
          mode: Debug
          max-size: 2G
      - name: Record exact resource qualification provenance
        env:
          HORO_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p build/d3d12-resource-evidence
          python - <<'PYTHON'
          import json
          import os
          from pathlib import Path
          import platform
          import subprocess
          assert platform.system() == "Windows" and platform.machine().lower() in {"amd64", "x86_64"}
          record = {"sourceHead": os.environ["HORO_SOURCE_HEAD"],
                    "checkoutRevision": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
                    "runId": os.environ["GITHUB_RUN_ID"], "runAttempt": os.environ["GITHUB_RUN_ATTEMPT"],
                    "runnerOS": os.environ["RUNNER_OS"], "runnerArch": os.environ["RUNNER_ARCH"],
                    "imageVersion": os.environ.get("ImageVersion"), "adapter": "explicit test-only WARP"}
          Path("build/d3d12-resource-evidence/provenance.json").write_text(json.dumps(record, indent=2))
          PYTHON
      - name: Configure native resource composition
        run: |
          set -o pipefail
          cmake --preset ci-windows-debug -B build/ci-d3d12-resources -DBUILD_TESTING=ON \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DHORO_BUILD_RENDER_VULKAN=OFF \
            -DHORO_BUILD_PHYSICS_NATIVE=OFF -DHORO_BUILD_NAVIGATION_RECAST_DETOUR=OFF \
            -DHORO_BUILD_INPUT_SDL3=OFF -DHORO_BUILD_EXAMPLES=OFF \
            2>&1 | tee build/d3d12-resource-evidence/configure.txt
      - name: Build actual native resource owner and startup contracts
        run: |
          set -o pipefail
          cmake --build build/ci-d3d12-resources --parallel 2 --target \
            HoroD3D12InitializationTests HoroD3D12ResourceTests \
            2>&1 | tee build/d3d12-resource-evidence/build.txt
      - name: Run startup lifecycle contracts
        run: |
          set -o pipefail
          ctest --test-dir build/ci-d3d12-resources --output-on-failure --parallel 1 --no-tests=error \
            -R '^HoroD3D12InitializationTests::' \
            --output-junit "$PWD/build/d3d12-resource-evidence/initialization.xml" \
            2>&1 | tee build/d3d12-resource-evidence/initialization.txt
      - name: Run actual WARP byte descriptor and retirement regressions
        run: |
          set -o pipefail
          build/ci-d3d12-resources/tests/HoroD3D12ResourceTests.exe '[warp]' \
            --reporter junit --out build/d3d12-resource-evidence/warp.xml \
            2>&1 | tee build/d3d12-resource-evidence/warp.txt
      - name: Upload resource qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d3d12-resource-qualification
          path: |
            build/d3d12-resource-evidence/
            build/ci-d3d12-resources/CMakeCache.txt
            build/ci-d3d12-resources/compile_commands.json
          if-no-files-found: warn

  test:
    name: Test · ${{ matrix.name }}
    needs: tooling
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      HORO_COMPILER_LAUNCHER: ${{ matrix.launcher }}
      HORO_LOG_LEVEL: debug
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux / GCC
            runner: ubuntu-24.04
            cc: gcc
            cxx: g++
            launcher: ccache
            preset: ci-linux-debug
          - name: macOS / Clang
            runner: macos-latest
            cc: clang
            cxx: clang++
            launcher: ccache
            preset: ci-macos-debug
          # The full Windows suite is still disabled. This preset builds the
          # existing focused contracts together in one headless composition.
          - name: Windows / MSVC
            runner: windows-2022
            cc: cl
            cxx: cl
            launcher: sccache
            preset: ci-windows-debug
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Setup build tools
        uses: ./.github/actions/setup-build-tools

      # Native publication requires a canonical parent. macOS TMPDIR may contain
      # /var aliases; establish the host temp root before tools and tests use it.
      - name: Canonicalize macOS temporary directory
        if: runner.os == 'macOS'
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import os
          import pathlib
          import tempfile

          root = pathlib.Path(tempfile.gettempdir()).resolve(strict=True)
          if not root.is_dir() or "\n" in str(root) or "\r" in str(root):
              raise RuntimeError("The temporary directory must be an existing canonical directory")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as environment:
              environment.write(f"TMPDIR={root}\n")
          PYTHON

      - name: Install native allocation verifier dependency
        id: qualification_python
        run: |
          verifier_python="$(python -c 'from pathlib import Path; import sys; print(Path(sys.executable).resolve().as_posix())')"
          echo "HORO_QUALIFICATION_PYTHON=$verifier_python" >> "$GITHUB_ENV"
          "$verifier_python" -m pip install --no-cache-dir --only-binary=:all: --no-deps defusedxml==0.7.1

      - name: Restore dependency and compiler caches
        id: cache
        uses: ./.github/actions/restore-native-cache
        with:
          # Preserve the existing main Debug checkpoint and build directory.
          # Compiler entries also validate the flags of auxiliary builds.
          profile: native-tests-v1
          dependency-profile: ${{ needs.tooling.outputs.network == 'true' && 'native-gns-v1' || '' }}
          mode: Debug
          max-size: 2G

      - name: Configure Debug
        run: cmake --preset "${{ matrix.preset }}" -DPython3_EXECUTABLE="$HORO_QUALIFICATION_PYTHON"

      - name: Build Debug
        id: debug_build
        run: cmake --build --preset "${{ matrix.preset }}"

      - name: Qualify OpenGL editor GUI composition with Mesa
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.debug_build.outcome == 'success' }}
        timeout-minutes: 2
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
        run: >-
          xvfb-run --auto-servernum --server-args="-screen 0 640x480x24"
          build/ci/tests/HoroEditorViewportOpenGLSmoke
          --reporter junit --out build/ci/opengl-editor-composition.xml

      - name: Cook Metal fixture and run native smoke when a device is available
        if: ${{ !cancelled() && runner.os == 'macOS' && steps.debug_build.outcome == 'success' }}
        env:
          HORO_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          "$HORO_QUALIFICATION_PYTHON" - <<'PYTHON'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess

          build = Path("build/ci-metal-shader")
          build.mkdir(parents=True, exist_ok=True)
          fixture = build / "tests/MetalPreparationFixture.metallib"
          record = {"sourceHead": os.environ["HORO_SOURCE_HEAD"],
                    "checkoutRevision": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
                    "runId": os.environ["GITHUB_RUN_ID"], "runAttempt": os.environ["GITHUB_RUN_ATTEMPT"],
                    "runnerOS": os.environ["RUNNER_OS"], "runnerArch": os.environ["RUNNER_ARCH"],
                    "imageVersion": os.environ.get("ImageVersion"),
                    "nativeStatus": "not_run", "commands": [], "tools": {}, "sourceSha256": {}}

          def digest(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          def run(command, *, capture=False):
              record["commands"].append(command)
              return subprocess.run(command, check=True, text=True,
                                    stdout=subprocess.PIPE if capture else None).stdout

          try:
              for source in ["tests/integration/renderer/MetalPreparationFixture.metal",
                             "tests/integration/renderer/MetalShaderPreparationSmoke.mm"]:
                  record["sourceSha256"][source] = digest(source)
              # Fail before cooking if the selected Xcode lacks the offline tools.
              for name in ["metal", "metallib", "clang"]:
                  path = run(["xcrun", "-sdk", "macosx", "--find", name], capture=True).strip()
                  record["tools"][name] = {"path": path, "sha256": digest(path)}
              record["xcodeVersion"] = run(["xcodebuild", "-version"], capture=True).strip()
              record["sdkVersion"] = run(["xcrun", "-sdk", "macosx", "--show-sdk-version"], capture=True).strip()
              run(["cmake", "--preset", "ci-macos-debug", "-B", str(build),
                   "-DPython3_EXECUTABLE=" + os.environ["HORO_QUALIFICATION_PYTHON"],
                   "-DHORO_ENABLE_GPU_SMOKE_TESTS=ON", "-DHORO_BUILD_EDITOR_GUI=OFF",
                   "-DHORO_BUILD_RENDER_OPENGL=OFF", "-DHORO_BUILD_PHYSICS_NATIVE=OFF",
                   "-DHORO_BUILD_NAVIGATION_RECAST_DETOUR=OFF"])
              commands = run(["ninja", "-C", str(build), "-t", "commands", "HoroMetalShaderPreparationSmoke"], capture=True).splitlines()
              fixture_markers = ["integration/renderer/MetalPreparationFixture.metal",
                                 "integration/renderer/MetalShaderPreparationSmoke.mm",
                                 " -o tests/HoroMetalShaderPreparationSmoke "]
              record["fixtureBuildCommands"] = [command for command in commands
                                                if any(marker in command for marker in fixture_markers)]
              assert all(any(marker in command for command in record["fixtureBuildCommands"])
                         for marker in fixture_markers), "Missing fixture cook, compile or link command"
              run(["cmake", "--build", str(build), "--target", "HoroMetalShaderPreparationSmoke", "--parallel", "2"])
              record["fixtureSha256"] = digest(fixture)
              probe_source = Path(os.environ["RUNNER_TEMP"]) / "horo-metal-device-probe.m"
              probe_binary = probe_source.with_suffix("")
              probe_source.write_text("#import <Metal/Metal.h>\nint main(void) { @autoreleasepool { return MTLCreateSystemDefaultDevice() == nil ? 77 : 0; } }\n")
              run(["xcrun", "clang", "-fobjc-arc", str(probe_source), "-framework", "Metal",
                   "-framework", "Foundation", "-o", str(probe_binary)])
              probe = subprocess.run([str(probe_binary)], check=False).returncode
              record["deviceProbeExit"] = probe
              if probe == 77:
                  record["nativeStatus"] = "skipped_no_device"
                  print("::notice::Metal graph and shader preparation GPU smoke skipped: no Metal device.")
              elif probe != 0:
                  raise RuntimeError("Metal device probe failed: " + str(probe))
              else:
                  # Keep the existing graph smoke and isolate this opt-in fixture's test registration.
                  graph = subprocess.run(["build/ci/tests/HoroMetalGraphExecutionSmoke"], check=False).returncode
                  record["graphSmokeExit"] = graph
                  record["nativeStatus"] = "failed"
                  run(["ctest", "--test-dir", str(build), "--parallel", "1", "--output-on-failure",
                       "--no-tests=error", "-R", "^HoroMetalShaderPreparationSmoke$",
                       "--output-junit", str(build.resolve() / "ctest.xml")])
                  record["nativeStatus"] = "passed"
                  if graph != 0:
                      raise RuntimeError("Metal graph smoke failed: " + str(graph))
          except Exception as error:
              record["error"] = str(error)
              raise
          finally:
              (build / "provenance.json").write_text(json.dumps(record, indent=2) + "\n")
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
                  summary.write("Metal shader preparation native smoke: " + record["nativeStatus"] + ".\n")
          PYTHON

      - name: Qualify Metal presentation and retained shutdown on an actual device
        if: ${{ !cancelled() && runner.os == 'macOS' && steps.debug_build.outcome == 'success' }}
        env:
          HORO_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          MTL_DEBUG_LAYER: '1'
        run: |
          "$HORO_QUALIFICATION_PYTHON" - <<'PYTHON'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess

          from xml.etree import ElementTree

          build = Path("build/ci-metal-presentation")
          build.mkdir(parents=True, exist_ok=True)
          record = {"sourceHead": os.environ["HORO_SOURCE_HEAD"],
                    "checkoutRevision": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
                    "runId": os.environ["GITHUB_RUN_ID"], "runAttempt": os.environ["GITHUB_RUN_ATTEMPT"],
                    "validationLayer": os.environ["MTL_DEBUG_LAYER"], "nativeStatus": "not_run", "commands": [],
                    "qualification": "native encoding/readback; physical EDR requires observed current headroom above one"}

          def run(command, *, capture=False):
              record["commands"].append(command)
              return subprocess.run(command, check=True, text=True,
                                    stdout=subprocess.PIPE if capture else None).stdout

          def record_presentation_result(record, build, returncode):
              selected = set(record["selectedTests"])
              owners = ["HoroRenderDisplayTests::", "HoroRenderFrontendTests::", "HoroRenderBackendRegistryTests::",
                        "HoroRenderMetalTests::", "HoroEditorViewportMetalSmoke::", "HoroMetalUploadShutdownSmoke::"]
              if any(not any(name.startswith(owner) for name in selected) for owner in owners) or "HoroEditorMetalFirstFrame" not in selected:
                  raise RuntimeError("Required qualification owner is absent from discovery")
              prefix = "HoroEditorViewportMetalSmoke::"
              expected = {name.removeprefix(prefix) for name in selected if name.startswith(prefix)}
              required = {"Editor Viewport Metal Smoke",
                          "SDL Metal host policy precedes view creation and publishes actual revisioned display facts",
                          "Native Metal realizes SDR, validates real drawables and coalesces latest resize before reuse",
                          "Metal explicit sRGB matching round-trips back to the unchanged unmanaged SDR policy",
                          "Metal linear EDR qualification uses actual host potential and native layer readback"}
              if not required.issubset(expected):
                  raise RuntimeError("Required presentation cases are absent from discovery")
              common = ElementTree.parse(build / "ctest.xml").findall(".//testcase")
              presentation = ElementTree.parse(build / "presentation.xml").findall(".//testcase")
              if {case.attrib["name"] for case in common} != {name for name in selected if not name.startswith(prefix)}:
                  raise RuntimeError("Common qualification JUnit does not match exact discovery")
              observed = {name for name in expected for case in presentation
                          if case.attrib["name"] == name or case.attrib["name"].startswith(name + "/")}
              unexpected = any(not any(case.attrib["name"] == name or case.attrib["name"].startswith(name + "/")
                                       for name in expected) for case in presentation)
              if observed != expected or not presentation or unexpected:
                  raise RuntimeError("Presentation JUnit does not match required discovered cases")
              cases = common + presentation
              skipped = [case.attrib["name"] for case in cases if case.find("skipped") is not None]
              record["executedCaseCount"] = len(cases) - len(skipped)
              record["skippedCases"] = skipped
              if any(case.find("failure") is not None or case.find("error") is not None for case in cases):
                  raise RuntimeError("Qualification JUnit contains a failure or error")
              # Only Catch's documented all-skipped exit is non-failing, and only with complete matching skipped evidence.
              all_skipped = all(case.find("skipped") is not None for case in presentation)
              if returncode != 0 and not (returncode == 4 and all_skipped):
                  raise RuntimeError("Native Metal presentation owner failed: " + str(returncode))
              record["nativeStatus"] = "incomplete_hardware_cases_skipped" if skipped else "passed"

          try:
              sources = ["apps/HoroEditor/app/HoroEditorApp.cpp",
                         "include/Horo/Runtime/Render/RenderPresentationOutput.h",
                         "src/editor/renderer/metal/SdlMetalPresentationPort.mm",
                         "src/runtime/renderer/modules/metal/MetalRuntime.mm",
                         "src/runtime/renderer/modules/metal/MetalDrawableAcquisition.mm",
                         "src/runtime/renderer/modules/metal/MetalPresentationOutput.mm",
                         "tests/integration/renderer/MetalPresentationSmoke.mm",
                         "tests/integration/renderer/EditorViewportMetalSmoke.mm",
                         "tests/integration/renderer/MetalUploadShutdownSmoke.mm"]
              record["sourceSha256"] = {source: hashlib.sha256(Path(source).read_bytes()).hexdigest() for source in sources}
              run(["cmake", "--preset", "ci-macos-debug", "-B", str(build),
                   "-DPython3_EXECUTABLE=" + os.environ["HORO_QUALIFICATION_PYTHON"],
                   "-DHORO_ENABLE_GPU_SMOKE_TESTS=ON", "-DHORO_BUILD_EDITOR_GUI=ON",
                   "-DHORO_BUILD_RENDER_METAL=ON", "-DHORO_BUILD_RENDER_OPENGL=OFF",
                   "-DHORO_BUILD_PHYSICS_NATIVE=OFF", "-DHORO_BUILD_NAVIGATION_RECAST_DETOUR=OFF"])
              targets = ["HoroEditor", "HoroRenderDisplayTests", "HoroRenderFrontendTests", "HoroRenderBackendRegistryTests",
                         "HoroRenderMetalTests", "HoroEditorViewportMetalSmoke", "HoroMetalUploadShutdownSmoke",
                         "HoroRenderApiPublicHeaderConsumer", "HoroRenderFrontendPublicHeaderConsumer"]
              record["buildTargets"] = targets
              record["buildOnlyConsumers"] = targets[-2:]
              run(["cmake", "--build", str(build), "--parallel", "2", "--target", *targets])
              probe_source = Path(os.environ["RUNNER_TEMP"]) / "horo-metal-presentation-probe.m"
              probe_binary = probe_source.with_suffix("")
              probe_source.write_text('#import <Metal/Metal.h>\n#import <AppKit/AppKit.h>\n#include <stdio.h>\n'
                                      'int main(void) { @autoreleasepool { id<MTLDevice> d = MTLCreateSystemDefaultDevice(); '
                                      'if (d == nil) return 77; NSScreen *s = NSScreen.mainScreen; '
                                      'NSDictionary *facts = @{@"device": d.name, @"registryId": @(d.registryID), '
                                      '@"screenAttached": @(s != nil), '
                                      '@"currentLinearHeadroom": @(s.maximumExtendedDynamicRangeColorComponentValue), '
                                      '@"potentialLinearHeadroom": @(s.maximumPotentialExtendedDynamicRangeColorComponentValue)}; '
                                      'NSData *json = [NSJSONSerialization dataWithJSONObject:facts options:0 error:nil]; '
                                      'return fwrite(json.bytes, 1, json.length, stdout) == json.length ? 0 : 1; } }\n')
              run(["xcrun", "clang", "-fobjc-arc", str(probe_source), "-framework", "Metal",
                   "-framework", "AppKit", "-framework", "Foundation", "-o", str(probe_binary)])
              probe = subprocess.run([str(probe_binary)], check=False, capture_output=True, text=True)
              record["deviceProbeExit"] = probe.returncode
              if probe.returncode == 77:
                  record["nativeStatus"] = "skipped_no_device"
                  print("::notice::Metal presentation qualification UNEXECUTED: no actual Metal device; no native/HDR success claim.")
              elif probe.returncode != 0:
                  raise RuntimeError("Metal presentation device probe failed: " + str(probe.returncode))
              else:
                  record["deviceAndDisplay"] = json.loads(probe.stdout)
                  pattern = ("^(HoroRender(Display|Frontend|BackendRegistry|Metal)Tests::|"
                             "HoroEditorViewportMetalSmoke::|HoroMetalUploadShutdownSmoke::|HoroEditorMetalFirstFrame$)")
                  record["testRegex"] = pattern
                  discovery = run(["ctest", "--test-dir", str(build), "--show-only=json-v1", "-R", pattern], capture=True)
                  (build / "test-discovery.json").write_text(discovery)
                  record["selectedTests"] = [test["name"] for test in json.loads(discovery)["tests"]]
                  assert any(name.startswith("HoroEditorViewportMetalSmoke::") for name in record["selectedTests"])
                  assert any(name.startswith("HoroMetalUploadShutdownSmoke::") for name in record["selectedTests"])
                  assert "HoroEditorMetalFirstFrame" in record["selectedTests"]
                  record["nativeStatus"] = "failed"
                  common = ("^(HoroRender(Display|Frontend|BackendRegistry|Metal)Tests::|"
                            "HoroMetalUploadShutdownSmoke::|HoroEditorMetalFirstFrame$)")
                  run(["ctest", "--test-dir", str(build), "--parallel", "1", "--timeout", "90", "--output-on-failure",
                       "--no-tests=error", "-R", common, "--output-junit", str(build.resolve() / "ctest.xml")])
                  # Catch's own JUnit distinguishes a skipped HDR case from successful SDR cases. The pinned
                  # CTest adapter otherwise treats an individually selected all-skipped case's exit 4 as failure.
                  presentation = [str(build / "tests/HoroEditorViewportMetalSmoke"), "--reporter", "junit",
                                  "--out", str(build.resolve() / "presentation.xml")]
                  record["commands"].append(presentation)
                  completed = subprocess.run(presentation, check=False, timeout=90)
                  record["presentationExit"] = completed.returncode
                  record_presentation_result(record, build, completed.returncode)
          except Exception as error:
              record["error"] = str(error)
              raise
          finally:
              (build / "provenance.json").write_text(json.dumps(record, indent=2) + "\n")
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
                  summary.write("Metal presentation/output qualification: " + record["nativeStatus"] + ".\n")
          PYTHON

      # Debug audio is already in the build above. Release verifies NDEBUG
