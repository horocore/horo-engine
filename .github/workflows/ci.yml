name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:
    inputs:
      save_allocation_diagnostics:
        description: Run bounded Windows Save allocation stack diagnostics
        type: boolean
        required: false
        default: false
      source_allocation_diagnostics:
        description: Run bounded Windows source edit allocation stack diagnostics
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tooling:
    name: Format & Tooling Check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      network: ${{ steps.changes.outputs.network }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Select optional network checks
        id: changes
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const networkChanged = require('./.github/scripts/network_changes.js');
            const selected = await networkChanged({ github, context, core });
            core.info(`Network checks: ${selected ? 'enabled' : 'skipped; no relevant changes'}`);
            core.setOutput('network', selected);

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tooling
        run: >-
          pip install --no-cache-dir --only-binary=:all: pytest==8.3.4 clang-format==19.1.7 defusedxml==0.7.1

      - name: Check C++ formatting
        run: python3 scripts/dev.py format --check

      - name: Test Python tooling
        run: pytest tests/python/

  android-storage:
    name: Android Storage · NDK arm64 API 29
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Select pinned adapter qualification NDK
        shell: bash
        run: |
          set -euo pipefail
          ndk_version=27.3.13750724
          if [[ ! -d "$ANDROID_HOME/ndk/$ndk_version" ]]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk_version"
          fi
          printf 'HORO_STORAGE_NDK=%s\n' "$ANDROID_HOME/ndk/$ndk_version" >> "$GITHUB_ENV"

      - name: Compile native adapter and standalone public header
        shell: bash
        run: |
          set -euo pipefail
          storage_compiler="$HORO_STORAGE_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang++"
          "$storage_compiler" --version
          "$storage_compiler" -std=c++20 -fsyntax-only -Iinclude -Isrc/platform/android src/platform/android/AndroidStorage.cpp
          "$storage_compiler" -std=c++20 -fsyntax-only -Iinclude -x c++ - <<'CPP'
          #include <Horo/Platform/AndroidStorage.h>
          CPP

  test:
    name: Test · ${{ matrix.name }}
    needs: tooling
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      HORO_COMPILER_LAUNCHER: ${{ matrix.launcher }}
      HORO_LOG_LEVEL: debug
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux / GCC
            runner: ubuntu-24.04
            cc: gcc
            cxx: g++
            launcher: ccache
            preset: ci-linux-debug
          - name: macOS / Clang
            runner: macos-latest
            cc: clang
            cxx: clang++
            launcher: ccache
            preset: ci-macos-debug
          # The full Windows suite is still disabled. This preset builds the
          # existing focused contracts together in one headless composition.
          - name: Windows / MSVC
            runner: windows-2022
            cc: cl
            cxx: cl
            launcher: sccache
            preset: ci-windows-debug
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Setup build tools
        uses: ./.github/actions/setup-build-tools

      # Native publication requires a canonical parent. macOS TMPDIR may contain
      # /var aliases; establish the host temp root before tools and tests use it.
      - name: Canonicalize macOS temporary directory
        if: runner.os == 'macOS'
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import os
          import pathlib
          import tempfile

          root = pathlib.Path(tempfile.gettempdir()).resolve(strict=True)
          if not root.is_dir() or "\n" in str(root) or "\r" in str(root):
              raise RuntimeError("The temporary directory must be an existing canonical directory")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as environment:
              environment.write(f"TMPDIR={root}\n")
          PYTHON

      - name: Install native allocation verifier dependency
        id: qualification_python
        run: |
          verifier_python="$(python -c 'from pathlib import Path; import sys; print(Path(sys.executable).resolve().as_posix())')"
          echo "HORO_QUALIFICATION_PYTHON=$verifier_python" >> "$GITHUB_ENV"
          "$verifier_python" -m pip install --no-cache-dir --only-binary=:all: --no-deps defusedxml==0.7.1

      - name: Restore dependency and compiler caches
        id: cache
        uses: ./.github/actions/restore-native-cache
        with:
          # Preserve the existing main Debug checkpoint and build directory.
          # Compiler entries also validate the flags of auxiliary builds.
          profile: native-tests-v1
          dependency-profile: ${{ needs.tooling.outputs.network == 'true' && 'native-gns-v1' || '' }}
          mode: Debug
          max-size: 2G

      - name: Configure Debug
        run: cmake --preset "${{ matrix.preset }}" -DPython3_EXECUTABLE="$HORO_QUALIFICATION_PYTHON"

      - name: Build Debug
        id: debug_build
        run: cmake --build --preset "${{ matrix.preset }}"

      - name: Run Metal graph smoke when a device is available
        if: ${{ !cancelled() && runner.os == 'macOS' && steps.debug_build.outcome == 'success' }}
        run: |
          probe_source="$RUNNER_TEMP/horo-metal-device-probe.m"
          probe_binary="$RUNNER_TEMP/horo-metal-device-probe"
          cat > "$probe_source" <<'OBJC'
          #import <Metal/Metal.h>
          int main(void) {
            @autoreleasepool {
              return MTLCreateSystemDefaultDevice() == nil ? 77 : 0;
            }
          }
          OBJC
          xcrun clang -fobjc-arc "$probe_source" -framework Metal -framework Foundation -o "$probe_binary"
          if "$probe_binary"; then
            build/ci/tests/HoroMetalGraphExecutionSmoke
          else
            probe_status=$?
            if [ "$probe_status" -eq 77 ]; then
              echo "::notice::Metal graph GPU smoke skipped: this macOS runner exposes no Metal device."
              echo "Metal graph GPU smoke: skipped (no Metal device)." >> "$GITHUB_STEP_SUMMARY"
            else
              exit "$probe_status"
            fi
          fi

      # Debug audio is already in the build above. Release verifies NDEBUG
      # behavior using only the real-time audio group, on this same runner.
      - name: Configure Release audio checks
        run: cmake --preset ci-audio-release

      - name: Build Release audio checks
        id: release_build
        run: cmake --build --preset ci-audio-release

      # MSVC Debug container moves may allocate iterator proxies inside noexcept.
      # Keep the complete admission/callback allocation sweep mandatory in Release.
      - name: Build Windows Release allocation qualification
        id: mcp_release_build
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.release_build.outcome == 'success' }}
        run: cmake --build --preset ci-audio-release --target HoroMcpSessionTests HoroRuntimeSaveRestoreTransactionTests HoroPhysicsTests HoroSceneRuntimeConversionTests HoroRuntimeSaveSlotLifecycleTests HoroNavigationProjectSettingsTests

      - name: Configure navigation without Recast Detour
        if: runner.os == 'Linux'
        run: cmake --preset ci-navigation-null

      - name: Build navigation without Recast Detour
        id: navigation_build
        if: runner.os == 'Linux'
        run: cmake --build --preset ci-navigation-null

      - name: Install macOS network crypto library
        if: ${{ !cancelled() && runner.os == 'macOS' && needs.tooling.outputs.network == 'true' && steps.cache.outcome == 'success' }}
        run: |
          brew install openssl@3
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"

      - name: Configure headless network with GNS
        id: network_configure
        if: ${{ !cancelled() && needs.tooling.outputs.network == 'true' && steps.cache.outcome == 'success' }}
        run: cmake --preset ci-network-gns

      - name: Build headless network with GNS
        id: network_build
        if: ${{ !cancelled() && steps.network_configure.outcome == 'success' }}
        run: cmake --build --preset ci-network-gns

      - name: Verify network without production dependencies
        if: ${{ !cancelled() && runner.os == 'Linux' && needs.tooling.outputs.network == 'true' && steps.cache.outcome == 'success' }}
        run: cmake --preset ci-network-disabled

      # This opt-in private backend qualification runs on every platform in the
      # existing matrix. Injected native dispatch is not physical-device evidence.
      - name: Configure OpenXR native lifecycle qualification
        id: xr_configure
        if: ${{ !cancelled() && steps.cache.outcome == 'success' }}
        run: cmake --preset ci-xr-openxr

      - name: Build OpenXR lifecycle and header boundaries
        id: xr_build
        if: ${{ !cancelled() && steps.xr_configure.outcome == 'success' }}
        run: cmake --build --preset ci-xr-openxr

      - name: Verify OpenXR omitted target graph
        if: ${{ !cancelled() && steps.cache.outcome == 'success' }}
        run: cmake --preset ci-xr-disabled

      - name: Checkpoint main build caches
        if: ${{ !cancelled() && steps.debug_build.outcome == 'success' }}
        continue-on-error: true
        uses: ./.github/actions/save-native-cache
        with:
          compiler-key: ${{ steps.cache.outputs.compiler-key }}
          dependency-key: ${{ steps.cache.outputs.dependency-key }}
          dependency-hit: ${{ steps.cache.outputs.dependency-hit }}
          dependency-ready: ${{ steps.xr_configure.outcome == 'success' && (needs.tooling.outputs.network != 'true' || steps.network_configure.outcome == 'success') }}

      - name: Prepare Windows mixer allocation diagnostics
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.debug_build.outcome == 'success' }}
        shell: pwsh
        run: ./.github/scripts/stage_windows_symbols.ps1 -BinaryDirectory build/ci/tests

      - name: Diagnose Windows Character input allocation timeout
        if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.number == 3362 && runner.os == 'Windows' && steps.debug_build.outcome == 'success' }}
        timeout-minutes: 3
        shell: pwsh
        run: ./.github/scripts/diagnose_character_input_windows.ps1 -BuildDirectory build/ci

      - name: Upload Windows Character input stack text
        if: ${{ always() && github.event_name == 'pull_request' && github.event.pull_request.number == 3362 && runner.os == 'Windows' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: character-input-stack-text-Windows
          path: |
            build/ci/character-input-diagnostics/status.txt
            build/ci/character-input-diagnostics/threads.txt
            build/ci/character-input-diagnostics/ctest.xml
          if-no-files-found: warn
          retention-days: 3

      - name: Diagnose Windows PCG evaluator completion timeout
        if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.number == 3403 && runner.os == 'Windows' && steps.debug_build.outcome == 'success' }}
        timeout-minutes: 3
        shell: pwsh
        run: >-
          ./.github/scripts/diagnose_character_input_windows.ps1 -BuildDirectory build/ci
          -BinaryName HoroPCGTests.exe -EvidenceName pcg-evaluator-diagnostics
          -TestCase 'HoroPCGTests::PCG catalog work cost is checked before executable allocation admission'

      - name: Upload Windows PCG evaluator stack text
        if: ${{ always() && github.event_name == 'pull_request' && github.event.pull_request.number == 3403 && runner.os == 'Windows' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pcg-evaluator-stack-text-Windows
          path: |
            build/ci/pcg-evaluator-diagnostics/status.txt
            build/ci/pcg-evaluator-diagnostics/threads.txt
            build/ci/pcg-evaluator-diagnostics/ctest.xml
          if-no-files-found: warn
          retention-days: 3

      - name: Diagnose Windows Save lifecycle allocation boundary
        if: ${{ !cancelled() && ((github.event_name == 'pull_request' && github.head_ref == 'fix/HORO-2421_windows_save_allocation_capture') || (github.event_name == 'workflow_dispatch' && inputs.save_allocation_diagnostics == true)) && runner.os == 'Windows' && steps.debug_build.outcome == 'success' }}
        timeout-minutes: 3
        shell: pwsh
        run: >-
          ./.github/scripts/diagnose_character_input_windows.ps1 -BuildDirectory build/ci
          -BinaryName HoroRuntimeSaveSlotLifecycleTests.exe -EvidenceName save-lifecycle-stack
          -TestCase 'HoroRuntimeSaveSlotLifecycleTests::Lifecycle allocation failure after visibility preserves publication knowledge' -CaptureSymbolEvidence

      - name: Diagnose Windows Save retention allocation boundary
        if: ${{ !cancelled() && ((github.event_name == 'pull_request' && github.head_ref == 'fix/HORO-2421_windows_save_allocation_capture') || (github.event_name == 'workflow_dispatch' && inputs.save_allocation_diagnostics == true)) && runner.os == 'Windows' && steps.debug_build.outcome == 'success' }}
        timeout-minutes: 3
        shell: pwsh
        run: >-
          ./.github/scripts/diagnose_character_input_windows.ps1 -BuildDirectory build/ci
          -BinaryName HoroRuntimeSaveSlotLifecycleTests.exe -EvidenceName save-retention-stack
          -TestCase 'HoroRuntimeSaveSlotLifecycleTests::Retention allocation failure after selection preserves publication and binding ownership' -CaptureSymbolEvidence

      - name: Record Windows Save allocation diagnostic provenance
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.debug_build.outcome == 'success' }}
        shell: pwsh
        run: |
          $diagnosticDirectory = Join-Path $env:RUNNER_TEMP 'save-allocation-diagnostics'
          New-Item -ItemType Directory -Force -Path $diagnosticDirectory | Out-Null
          $files = @('build/ci/tests/HoroRuntimeSaveSlotLifecycleTests.exe',
                     'build/ci/tests/HoroRuntimeSaveSlotLifecycleTests.pdb') | ForEach-Object {
            $path = Join-Path $env:GITHUB_WORKSPACE $_
            if (Test-Path -LiteralPath $path -PathType Leaf) {
              @{ path = $path; sha256 = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash }
            } else {
              @{ path = $path; missing = $true }
            }
          }
          $tools = @('procdump64.exe', 'cdb.exe') | ForEach-Object {
            $tool = Get-Command $_ -CommandType Application -ErrorAction SilentlyContinue
            @{ name = $_; path = @($tool | ForEach-Object { $_.Source }) }
          }
          @{
            source = (git rev-parse HEAD)
            run = $env:GITHUB_RUN_ID
            attempt = $env:GITHUB_RUN_ATTEMPT
            files = @($files)
            toolsOnPath = @($tools)
            symbolMatch = 'unverified; file hashes alone do not establish executable/PDB matching'
            stackCapture = 'not performed; no debugger installation or attachment assumed'
            timeoutSeconds = 90
          } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $diagnosticDirectory 'provenance.json')

      - name: Diagnose Windows source edit allocation boundary
        if: ${{ !cancelled() && ((github.event_name == 'pull_request' && github.head_ref == 'fix/HORO-224_source_edit_allocation_recovery') || (github.event_name == 'workflow_dispatch' && inputs.source_allocation_diagnostics == true)) && runner.os == 'Windows' && steps.debug_build.outcome == 'success' }}
        timeout-minutes: 3
        shell: pwsh
        run: >-
          ./.github/scripts/diagnose_character_input_windows.ps1 -BuildDirectory build/ci
          -BinaryName HoroSourceFileOpenServiceTests.exe -EvidenceName source-edit-stack
          -TestCase 'HoroSourceFileOpenServiceTests::Cancelled and allocation-failed source operations do not publish partial roots' -CaptureSymbolEvidence

      - name: Test Debug
        if: ${{ !cancelled() && steps.debug_build.outcome == 'success' }}
        run: ctest --preset "${{ matrix.preset }}"

      - name: Test Release audio checks
        if: ${{ !cancelled() && steps.release_build.outcome == 'success' }}
        run: ctest --preset ci-audio-release

      - name: Test Windows Release MCP allocation qualification
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.mcp_release_build.outcome == 'success' }}
        run: >-
          ctest --test-dir build/ci-audio-release --parallel 1 --output-on-failure
          --no-tests=error --timeout 120 -R '^HoroMcpSessionTests::'
          --output-junit build/ci-audio-release/mcp-ctest.xml

      - name: Test Windows Release restore allocation qualification
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.mcp_release_build.outcome == 'success' }}
        run: >-
          ctest --test-dir build/ci-audio-release --parallel 1 --output-on-failure
          --no-tests=error --timeout 90 -R '^HoroRuntimeSaveRestoreTransactionTests::'
          --output-junit build/ci-audio-release/restore-ctest.xml

      - name: Test Windows Release Scene allocation qualification
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.mcp_release_build.outcome == 'success' }}
        shell: pwsh
        run: |
          $root = 'build/ci-audio-release'
          ctest --test-dir $root --show-only=json-v1 | Set-Content -LiteralPath "$root/scene-allocation-discovery.json" -Encoding utf8
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/ci/run_scene_allocation_qualification.py --discovery "$root/scene-allocation-discovery.json" --regex-output "$root/scene-allocation-regex.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $pattern = Get-Content -Raw -LiteralPath "$root/scene-allocation-regex.txt"
          if (Test-Path -LiteralPath "$root/scene-allocation-ctest.xml") {
            Remove-Item -LiteralPath "$root/scene-allocation-ctest.xml" -ErrorAction Stop
          }
          ctest --test-dir $root --parallel 1 --output-on-failure --no-tests=error --timeout 90 -R $pattern --output-junit "scene-allocation-ctest.xml"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/ci/run_scene_allocation_qualification.py --output-junit "$root/scene-allocation-ctest.xml"

      - name: Test Windows Release Navigation settings allocation qualification
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.mcp_release_build.outcome == 'success' }}
        shell: pwsh
        run: |
          $root = 'build/ci-audio-release'
          ctest --test-dir $root --show-only=json-v1 | Set-Content -LiteralPath "$root/navigation-allocation-discovery.json" -Encoding utf8
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/ci/run_scene_allocation_qualification.py --family navigation --discovery "$root/navigation-allocation-discovery.json" --regex-output "$root/navigation-allocation-regex.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $pattern = Get-Content -Raw -LiteralPath "$root/navigation-allocation-regex.txt"
          if (Test-Path -LiteralPath "$root/navigation-allocation-ctest.xml") {
            Remove-Item -LiteralPath "$root/navigation-allocation-ctest.xml" -ErrorAction Stop
          }
          ctest --test-dir $root --parallel 1 --output-on-failure --no-tests=error --timeout 90 -R $pattern --test-output-size-passed 16384 --output-junit "navigation-allocation-ctest.xml"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/ci/run_scene_allocation_qualification.py --family navigation --output-junit "$root/navigation-allocation-ctest.xml"

      - name: Test Windows Release Character allocation qualification
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.mcp_release_build.outcome == 'success' }}
        shell: pwsh
        run: |
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $root = 'build/ci-audio-release'
          ctest --test-dir $root --show-only=json-v1 | Set-Content -LiteralPath "$root/character-allocation-discovery.json" -Encoding utf8
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/ci/run_character_allocation_qualification.py --discovery "$root/character-allocation-discovery.json" --regex-output "$root/character-allocation-regex.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $pattern = Get-Content -Raw -LiteralPath "$root/character-allocation-regex.txt"
          if (Test-Path -LiteralPath "$root/character-allocation-ctest.xml") {
            Remove-Item -LiteralPath "$root/character-allocation-ctest.xml" -ErrorAction Stop
          }
          ctest --test-dir $root --parallel 1 --output-on-failure --no-tests=error --timeout 90 -R $pattern --output-junit "character-allocation-ctest.xml"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/ci/run_character_allocation_qualification.py --output-junit "$root/character-allocation-ctest.xml"

      - name: Test Windows Release Save lifecycle allocation qualification
        id: save_allocation_release_tests
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.mcp_release_build.outcome == 'success' }}
        run: >-
          ctest --test-dir build/ci-audio-release --parallel 1 --output-on-failure
          --no-tests=error --timeout 90
          -R '^HoroRuntimeSaveSlotLifecycleTests::(Lifecycle allocation failure after visibility preserves publication knowledge|Retention allocation failure after selection preserves publication and binding ownership)$'
          --test-output-size-passed 16384
          --output-junit save-allocation-ctest.xml

      - name: Install Windows Save qualification XML parser
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.save_allocation_release_tests.outcome == 'success' }}
        run: >-
          python -m pip install --no-cache-dir --only-binary=:all: defusedxml==0.7.1

      - name: Verify Windows Release Save allocation variants
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.save_allocation_release_tests.outcome == 'success' }}
        run: python scripts/verify_save_allocation_qualification.py build/ci-audio-release/save-allocation-ctest.xml

      - name: Test navigation without Recast Detour
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.navigation_build.outcome == 'success' }}
        run: ctest --preset ci-navigation-null

      - name: Test GNS connections, DNS, delivery and lifecycle
        if: ${{ !cancelled() && steps.network_build.outcome == 'success' }}
        run: ctest --preset ci-network-gns

      - name: Test OpenXR rollback replacement and shutdown
        if: ${{ !cancelled() && steps.xr_build.outcome == 'success' }}
        run: ctest --preset ci-xr-openxr

      - name: Upload Windows source edit allocation stack evidence
        if: ${{ always() && ((github.event_name == 'pull_request' && github.head_ref == 'fix/HORO-224_source_edit_allocation_recovery') || (github.event_name == 'workflow_dispatch' && inputs.source_allocation_diagnostics == true)) && runner.os == 'Windows' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: source-edit-stack-Windows-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            build/ci/source-edit-stack/status.txt
            build/ci/source-edit-stack/threads.txt
            build/ci/source-edit-stack/ctest.xml
            build/ci/source-edit-stack/provenance.json
          if-no-files-found: warn
          retention-days: 3

      - name: Upload Windows Save allocation stack evidence
        if: ${{ always() && ((github.event_name == 'pull_request' && github.head_ref == 'fix/HORO-2421_windows_save_allocation_capture') || (github.event_name == 'workflow_dispatch' && inputs.save_allocation_diagnostics == true)) && runner.os == 'Windows' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: save-allocation-stack-Windows-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            build/ci/save-lifecycle-stack/status.txt
            build/ci/save-lifecycle-stack/threads.txt
            build/ci/save-lifecycle-stack/ctest.xml
            build/ci/save-lifecycle-stack/provenance.json
            build/ci/save-retention-stack/status.txt
            build/ci/save-retention-stack/threads.txt
            build/ci/save-retention-stack/ctest.xml
            build/ci/save-retention-stack/provenance.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Windows Save allocation diagnostics
        if: ${{ always() && runner.os == 'Windows' && steps.debug_build.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: save-allocation-Windows-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/save-allocation-diagnostics/provenance.json
