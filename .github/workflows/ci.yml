# Diagnostic branch only: this queries host facts and does not qualify a PR.
name: Metal runner capability probe
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: metal-host-probe-${{ github.ref }}
  cancel-in-progress: false
jobs:
  inspect:
    name: Metal host facts · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 3
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os: [macos-15, macos-26, macos-26-intel]
    env:
      MTL_DEBUG_LAYER: '1'
    steps:
      - name: Query device families without building the engine
        run: |
          cat > "$RUNNER_TEMP/metal-device.m" <<'OBJC'
          #import <Metal/Metal.h>
          #include <stdio.h>
          int main(void) { @autoreleasepool {
          #if defined(__aarch64__) || defined(__arm64__)
            NSString *architecture = @"arm64";
          #elif defined(__x86_64__)
            NSString *architecture = @"x86_64";
          #else
            NSString *architecture = @"unsupported";
          #endif
            id<MTLDevice> selected = MTLCreateSystemDefaultDevice();
            NSMutableArray *devices = [NSMutableArray array];
            for (id<MTLDevice> device in MTLCopyAllDevices()) {
              [devices addObject:@{
                @"name": device.name ?: @"",
                @"registryId": @(device.registryID),
                @"selected": @(selected != nil && device.registryID == selected.registryID),
                @"apple7": @([device supportsFamily:MTLGPUFamilyApple7]),
                @"mac2": @([device supportsFamily:MTLGPUFamilyMac2])
              }];
            }
            NSData *json = [NSJSONSerialization dataWithJSONObject:@{
              @"processArchitecture": architecture,
              @"os": NSProcessInfo.processInfo.operatingSystemVersionString,
              @"devices": devices
            } options:0 error:nil];
            if (json == nil) return 1;
            fwrite(json.bytes, 1, json.length, stdout);
            fputc('\n', stdout);
            return selected == nil ? 77 : 0;
          } }
          OBJC
          xcrun clang -fobjc-arc "$RUNNER_TEMP/metal-device.m" -framework Metal -framework Foundation -o "$RUNNER_TEMP/metal-device"
          status=0
          "$RUNNER_TEMP/metal-device" > "$RUNNER_TEMP/metal-facts.json" || status=$?
          cat "$RUNNER_TEMP/metal-facts.json"
          {
            echo '## Metal host facts only; no engine GPU qualification'
            echo '```json'
            cat "$RUNNER_TEMP/metal-facts.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" = 77 ]; then
            echo '::notice::This host exposes no Metal device.'
          else
            exit "$status"
          fi
