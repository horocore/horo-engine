          if (Test-Path -LiteralPath "$root/collision-allocation-ctest.xml") {
            Remove-Item -LiteralPath "$root/collision-allocation-ctest.xml" -ErrorAction Stop
          }
          ctest --test-dir $root --parallel 1 --output-on-failure --no-tests=error --timeout 90 --test-output-size-passed 16384 -R $pattern --output-junit "collision-allocation-ctest.xml"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/dev.py qualify-scene --family collision --output-junit "$root/collision-allocation-ctest.xml"

      - name: Test Windows Release Character allocation qualification
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.mcp_release_build.outcome == 'success' }}
        shell: pwsh
        run: |
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $root = 'build/ci-audio-release'
          ctest --test-dir $root --show-only=json-v1 | Set-Content -LiteralPath "$root/character-allocation-discovery.json" -Encoding utf8
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/dev.py qualify-character --discovery "$root/character-allocation-discovery.json" --regex-output "$root/character-allocation-regex.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
