name: Unicode vendor coverage benchmark

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: unicode-vendor-coverage-benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      CC: gcc
      CXX: g++
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_DIR: ${{ github.workspace }}/.sonar/ccache
      CCACHE_MAXSIZE: 2G
      HORO_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Restore fetched sources without publishing
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            .cmake/fetchcontent/*-src
            .cmake/fetchcontent/*-subbuild
          key: sonar-v4-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('CMakeLists.txt', 'cmake/Dependencies.cmake', 'cmake/*Dependency.cmake', 'cmake/Horo*DependencyPolicy.cmake', 'cmake/HoroGnsProtobufConfig.cmake') }}
      - uses: ./.github/actions/setup-build-tools
      - name: Identify instrumented compilers
        id: compiler_identity
        run: |
          python3 scripts/dev.py ci-cache-identity --github-output "$GITHUB_OUTPUT" \
            --cc gcc --cxx g++ --cc-version "$(gcc -dumpfullversion -dumpversion)" \
            --cxx-version "$(g++ -dumpfullversion -dumpversion)" --cmake-version "$(cmake --version)"
      - uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6
        with:
          version: 1.3.0
      - name: Restore trusted instrumented compiler checkpoint
        continue-on-error: true
        timeout-minutes: 4
        env:
          COMPILER_NAMESPACE: sonar-v3-${{ runner.os }}-${{ runner.arch }}-${{ steps.compiler_identity.outputs.c-compiler }}-${{ steps.compiler_identity.outputs.compiler }}-main-
        run: python3 .github/scripts/compiler_registry.py fetch --key "$COMPILER_NAMESPACE"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned coverage tooling
        run: |
          python3 -m venv /tmp/horo-coverage
          /tmp/horo-coverage/bin/pip install --disable-pip-version-check --no-cache-dir \
            fastcov==1.17 defusedxml==0.7.1
      - name: Compare actual Unicode tests and owned coverage
        timeout-minutes: 15
        run: /tmp/horo-coverage/bin/python .github/scripts/benchmark_unicode_profile.py
      - name: Preserve experiment evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: unicode-vendor-coverage-benchmark
          path: build/unicode-profile-benchmark
          if-no-files-found: error
          retention-days: 7
