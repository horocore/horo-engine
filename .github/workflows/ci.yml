          IDENTITY = 'HoroRuntimeSceneTests::Tracked baseline cancellation retires only its own Scene receipt'
          TITLE = IDENTITY.split('::', 1)[1]
          REGEX = '^' + IDENTITY + '$'
          FORBIDDEN = {'DISABLED', 'WILL_FAIL', 'SKIP_REGULAR_EXPRESSION', 'PASS_REGULAR_EXPRESSION'}

          def require(condition, message):
              if not condition:
                  raise ValueError(message)

          def discovery(listing, executable):
              require(listing['kind'] == 'ctestInfo' and listing['version']['major'] == 1, 'wrong CTest JSON schema')
              tests = listing['tests']
              require(len(tests) == 1 and tests[0]['name'] == IDENTITY, 'not exactly the one reviewed Scene identity')
              case = tests[0]
              command = case['command']
              require(len(command) == 2 and Path(command[0]).resolve() == executable.resolve() and command[1] == TITLE,
                      'wrong Scene executable, wrapper, filter, or extra Catch arguments')
              properties = case.get('properties', [])
              skip_codes = [p['value'] for p in properties if p['name'] == 'SKIP_RETURN_CODE']
              require(len(skip_codes) == 1 and type(skip_codes[0]) is int and skip_codes[0] == 4,
                      'Catch default skip code must remain exactly one integer 4; actual skips still forbidden')
              require(not any(p['name'] in FORBIDDEN for p in properties), 'Scene skip or failure-inversion property')

          def evidence(folder):
              root = ET.parse(folder / 'scene-focused.xml').getroot()
              cases = list(root.iter('testcase'))
              require(len(cases) == 1 and cases[0].get('name') == IDENTITY, 'Scene JUnit exact one identity mismatch')
              require(root.tag == 'testsuite' and int(root.attrib['tests']) == 1, 'Scene CTest JUnit count/schema mismatch')
              for suite in root.iter('testsuite'):
                  for key in ['failures', 'errors', 'skipped', 'disabled']:
                      require(int(suite.get(key, '0')) == 0, 'Scene nonzero ' + key)
              require(cases[0].get('status') == 'run', 'Scene case did not actually run')
              require(not any(n.tag in ['failure', 'error', 'skipped'] for n in root.iter()), 'Scene failed, errored or skipped case')
              log = (folder / 'scene-focused-LastTest.log').read_text(encoding='utf-8-sig')
              output = cases[0].findtext('system-out', '')
              require(not re.search(r'SKIPPED|FAILED - but was ok|\b[1-9][0-9]* skipped\b', log + '\n' + output),
                      'Scene Catch skip or tolerated failure')
              return {'identity': IDENTITY, 'testcase_count': 1, 'failures_errors_skips_disabled': 0}

          def file_hash(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          def main():
              folder = Path(os.environ['RUNNER_TEMP']) / 'm3-diagnostic'
              folder.mkdir(exist_ok=True)
              executable = (Path.cwd() / 'build/m3-probe/tests/HoroRuntimeSceneTests.exe').resolve()
              report = {'identity': IDENTITY, 'discovery_exit': None, 'native_exit': None, 'status': 'failure',
                        'qualification': 'Behavioral RED requires successful admission/control, then Pending after exact cancel plus real commit; setup/compiler failure is not behavioral RED.'}
              native_exit = None
              try:
                  listed = subprocess.run(['ctest', '--test-dir', 'build/m3-probe', '-R', REGEX, '--show-only=json-v1'],
                                          stdout=subprocess.PIPE, stderr=subprocess.PIPE)
                  report['discovery_exit'] = listed.returncode
                  (folder / 'scene-focused-discovery.json').write_bytes(listed.stdout)
                  (folder / 'scene-focused-discovery.log').write_bytes(listed.stderr)
                  require(listed.returncode == 0, 'Scene CTest discovery failed')
                  discovery(json.loads(listed.stdout), executable)
                  report['executable_sha256_before'] = file_hash(executable)
                  run = subprocess.run(['ctest', '--test-dir', 'build/m3-probe', '-R', REGEX, '--no-tests=error',
                                        '--output-on-failure', '--output-junit', str(folder / 'scene-focused.xml'),
                                        '--timeout', '120', '--parallel', '1'], stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
                  native_exit = report['native_exit'] = run.returncode
                  (folder / 'scene-focused.log').write_bytes(run.stdout)
                  print(run.stdout.decode('utf-8', errors='replace'))
                  shutil.copyfile('build/m3-probe/Testing/Temporary/LastTest.log', folder / 'scene-focused-LastTest.log')
                  report['executable_sha256_after'] = file_hash(executable)
                  require(report['executable_sha256_after'] == report['executable_sha256_before'], 'Scene executable bytes changed during execution')
                  report['evidence'] = evidence(folder)
                  require(native_exit == 0, 'Scene CTest native exit failed')
                  report['status'] = 'success'
              except Exception as error:
                  report['error'] = str(error)
              finally:
                  # Preserve a failed native result; neither an expected RED nor an evidence exception turns it GREEN.
                  code = native_exit if native_exit not in [None, 0] else int(report['status'] != 'success')
                  report['step_exit'] = code
                  (folder / 'scene-focused-outcome.json').write_text(json.dumps(report, indent=2), encoding='utf-8')
                  print(json.dumps(report, indent=2))
              return code

          if __name__ == '__main__':
              sys.exit(main())
          '@ | python -
          exit $LASTEXITCODE
      - name: Record honest step outcomes
        if: always()
        run: |
          $result = @{ configure = '${{ steps.configure.outcome }}'; world_build = '${{ steps.world_build.outcome }}'; world_tests = '${{ steps.world_red.outcome }}'; terrain_compilation = '${{ steps.terrain_red.outcome }}'; public_header_consumers = '${{ steps.public_consumers_build.outcome }}'; world_suite = '${{ steps.world_suite.outcome }}'; terrain_build = '${{ steps.terrain_build.outcome }}'; terrain_suite = '${{ steps.terrain_suite.outcome }}'; evidence_validation = '${{ steps.evidence_check.outcome }}'; scene_build = '${{ steps.scene_build.outcome }}'; scene_focused = '${{ steps.scene_focused.outcome }}' }
          $folder = Join-Path $env:RUNNER_TEMP 'm3-diagnostic'
          New-Item -ItemType Directory -Force -Path $folder | Out-Null
          $result | ConvertTo-Json | Set-Content -Encoding utf8 (Join-Path $folder 'outcomes.json')
          $result | ConvertTo-Json
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m3-windows-diagnostic-${{ github.sha }}
          path: |-
            ${{ runner.temp }}/m3-diagnostic/
            build/m3-probe/compile_commands.json
          if-no-files-found: error
          retention-days: 7
      - name: Keep RED failures visible - never label expected failures GREEN
        if: always()
        run: |
          if ('${{ steps.configure.outcome }}' -ne 'success' -or '${{ steps.world_build.outcome }}' -ne 'success' -or '${{ steps.world_red.outcome }}' -ne 'success' -or '${{ steps.terrain_red.outcome }}' -ne 'success' -or '${{ steps.public_consumers_build.outcome }}' -ne 'success' -or '${{ steps.world_suite.outcome }}' -ne 'success' -or '${{ steps.terrain_build.outcome }}' -ne 'success' -or '${{ steps.terrain_suite.outcome }}' -ne 'success' -or '${{ steps.evidence_check.outcome }}' -ne 'success' -or '${{ steps.scene_build.outcome }}' -ne 'success' -or '${{ steps.scene_focused.outcome }}' -ne 'success') { exit 1 }
