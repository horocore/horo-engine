name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:
    inputs:
      save_allocation_diagnostics:
        description: Run bounded Windows Save allocation stack diagnostics
        type: boolean
        required: false
        default: false
      source_allocation_diagnostics:
        description: Run bounded Windows source edit allocation stack diagnostics
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tooling:
    name: Format & Tooling Check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      network: ${{ steps.changes.outputs.network }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Select optional network checks
        id: changes
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const networkChanged = require('./.github/scripts/network_changes.js');
            const selected = await networkChanged({ github, context, core });
            core.info(`Network checks: ${selected ? 'enabled' : 'skipped; no relevant changes'}`);
            core.setOutput('network', selected);

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tooling
        run: >-
          pip install --no-cache-dir --only-binary=:all: pytest==8.3.4 clang-format==19.1.7 defusedxml==0.7.1

      - name: Check C++ formatting
        run: python3 scripts/dev.py format --check

      - name: Test Python tooling
        run: pytest tests/python/

  android-storage:
    name: Android Storage · NDK arm64 API 29
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Select pinned adapter qualification NDK
        shell: bash
        run: |
          set -euo pipefail
          ndk_version=27.3.13750724
          if [[ ! -d "$ANDROID_HOME/ndk/$ndk_version" ]]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk_version"
          fi
          printf 'HORO_STORAGE_NDK=%s\n' "$ANDROID_HOME/ndk/$ndk_version" >> "$GITHUB_ENV"

      - name: Compile native adapter and standalone public header
        shell: bash
        run: |
          set -euo pipefail
          storage_compiler="$HORO_STORAGE_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang++"
          "$storage_compiler" --version
          "$storage_compiler" -std=c++20 -fsyntax-only -Iinclude -Isrc/platform/android src/platform/android/AndroidStorage.cpp
          "$storage_compiler" -std=c++20 -fsyntax-only -Iinclude -x c++ - <<'CPP'
          #include <Horo/Platform/AndroidStorage.h>
          CPP

  shaders:
    name: Shaders · ${{ matrix.os }}
    needs: tooling
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            preset: ci-linux-debug
            cc: gcc
            cxx: g++
            launcher: ccache
          - os: windows-2022
            preset: ci-windows-debug
            cc: cl
            cxx: cl
            launcher: sccache
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      HORO_COMPILER_LAUNCHER: ${{ matrix.launcher }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: ./.github/actions/setup-build-tools
      - name: Select software Vulkan driver
        if: runner.os == 'Linux'
        run: |
          selected_icd="$(python3 scripts/dev.py select-lavapipe-icd)"
          printf 'VK_DRIVER_FILES=%s\n' "$selected_icd" >> "$GITHUB_ENV"
      - name: Restore compatible main dependency and compiler caches
        uses: ./.github/actions/restore-native-cache
        with:
          profile: native-tests-v1
          mode: Debug
          max-size: 2G
      - name: Configure focused headless Vulkan composition
        run: >-
          cmake --preset "${{ matrix.preset }}"
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          -DHORO_BUILD_XR_OPENXR=ON -DHORO_BUILD_RENDER_VULKAN=ON -DHORO_ENABLE_GPU_SMOKE_TESTS=ON -DHORO_BUILD_EDITOR_GUI=${{ runner.os == 'Linux' && 'ON' || 'OFF' }}
          -DHORO_BUILD_RENDER_OPENGL=OFF -DHORO_BUILD_RENDER_METAL=OFF
          -DHORO_BUILD_AUDIO_SDL3=OFF -DHORO_ENABLE_OPENTELEMETRY=OFF
          -DHORO_BUILD_PHYSICS_NATIVE=OFF -DHORO_BUILD_NAVIGATION_RECAST_DETOUR=OFF
      - name: Build native Vulkan contracts
        run: >-
          cmake --build build/ci --target
          HoroMultiviewSceneExtractionTests HoroMultiviewSceneExtractionPublicHeaderConsumer HoroXRApiTests HoroXROpenXRTests
          HoroRenderVulkanTests HoroPipelineCacheTests HoroShaderPermutationTests HoroMaterialBindingTests HoroMaterialBindingPublicHeaderConsumer
          HoroRenderGraphTests HoroRenderFrontendTests HoroRenderBackendRegistryTests HoroXROpenXRHostInterfaceConsumer --parallel 2
      - name: Build the matching Vulkan editor composition
        if: runner.os == 'Linux'
        run: |
          cmake --build build/ci --target HoroEditor HoroEditorVulkanShaderCook \
            HoroShaderReflectionCookTests HoroEditorVulkanPresentationSmoke \
            HoroRenderFrontendPublicHeaderConsumer HoroRenderApiPublicHeaderConsumer --parallel 2
          python3 - <<'PYCODE'
          import json
          from pathlib import Path
          commands = json.loads(Path("build/ci/compile_commands.json").read_text())
          sources = [Path(entry["file"]).as_posix() for entry in commands]
          required = {
              "src/runtime/renderer/modules/vulkan/VulkanPresentationRuntime.cpp",
              "src/runtime/renderer/modules/vulkan/VulkanGuiCommands.cpp",
              "src/editor/renderer/vulkan/EditorGuiRendererVulkan.cpp",
              "src/editor/renderer/vulkan/EditorViewportRendererVulkan.cpp",
              "tests/integration/renderer/EditorVulkanPresentationSmoke.cpp",
          }
          missing = [name for name in required if not any(source.endswith(name) for source in sources)]
          if missing:
              raise SystemExit(f"Native Vulkan translation units missing from the actual compile database: {missing}")
          PYCODE
      - name: Cook the viewport with the canonical locked tools
        if: runner.os == 'Linux'
        uses: ./.github/actions/cook-vulkan-viewport
        with:
          asset-root: ${{ github.workspace }}/build/ci/native-editor-assets
      - name: Produce private canonical UI Metal qualification handoff
        if: runner.os == 'Linux'
        run: >-
          python3 .github/scripts/ui_paint_fixture.py produce
          --root "$RUNNER_TEMP/ui-paint-msl"
          --tools-root "$RUNNER_TEMP/viewport-cook-tools"
      - name: Retain same-run UI Metal qualification inputs
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ui-paint-metal-msl-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ui-paint-msl/
          if-no-files-found: error
          retention-days: 3
      - name: Stage the canonical viewport assets for the editor
        if: runner.os == 'Linux'
        run: |
          asset_root="$GITHUB_WORKSPACE/build/ci/native-editor-assets"
          editor_asset_root="$(cat build/ci/apps/HoroEditorAssetRoot-Debug.txt)"
          cmake -E copy_directory "$asset_root" "$editor_asset_root"
          printf 'HORO_EDITOR_VULKAN_ASSET_ROOT=%s\n' "$editor_asset_root" >> "$GITHUB_ENV"
      - name: Build Vulkan command smoke
        if: runner.os == 'Linux'
        run: cmake --build build/ci --target HoroVulkanCommandExecutionSmoke --parallel 2
      - name: Run Vulkan native-call and lifecycle regressions
        run: >-
          ctest --test-dir build/ci --no-tests=error --parallel 1 --timeout 90 --output-on-failure
          -R '^(HoroMultiviewSceneExtractionTests::|HoroMultiviewSceneExtractionPublicHeaderConsumer$|HoroXRApiTests::|HoroXROpenXRTests::|HoroRenderVulkanTests::|HoroPipelineCacheTests::|HoroShaderPermutationTests::|HoroMaterialBindingTests::|HoroMaterialBindingPublicHeaderConsumer$|HoroRenderGraphTests::|HoroRenderFrontendTests::|HoroRenderBackendRegistryTests::)'
          --output-junit ctest.xml
      - name: Compile Vulkan shaders
        if: runner.os == 'Linux'
        run: |
          glslangValidator --target-env vulkan1.3 -V tests/integration/renderer/VulkanPreparation.vert -o "$RUNNER_TEMP/preparation.vert.spv"
          glslangValidator --target-env vulkan1.3 -V tests/integration/renderer/VulkanPreparation.frag -o "$RUNNER_TEMP/preparation.frag.spv"
          glslangValidator --target-env vulkan1.3 -V tests/integration/renderer/VulkanTransform.vert -o "$RUNNER_TEMP/transform.vert.spv"
          glslangValidator --target-env vulkan1.3 -V tests/integration/renderer/VulkanTransform.frag -o "$RUNNER_TEMP/transform.frag.spv"
          glslangValidator --target-env vulkan1.3 -V -D -S vert -e VSMain assets/shaders/runtime/multiview_mesh.hlsl -o "$RUNNER_TEMP/multiview.vert.spv"
          glslangValidator --target-env vulkan1.3 -V -D -DHORO_MULTIVIEW_LAYER_ROUTING=1 -S vert -e VSMain assets/shaders/runtime/multiview_mesh.hlsl -o "$RUNNER_TEMP/multiview-layer.vert.spv"
          glslangValidator --target-env vulkan1.3 -V -D -S frag -e PSMain assets/shaders/runtime/multiview_mesh.hlsl -o "$RUNNER_TEMP/multiview.frag.spv"
      - name: Test Vulkan shaders on lavapipe
        if: runner.os == 'Linux'
        run: |
          HORO_MULTIVIEW_VERTEX="$RUNNER_TEMP/multiview.vert.spv" \
          HORO_MULTIVIEW_LAYER_VERTEX="$RUNNER_TEMP/multiview-layer.vert.spv" \
          HORO_MULTIVIEW_FRAGMENT="$RUNNER_TEMP/multiview.frag.spv" \
          HORO_VULKAN_TRANSFORM_VERTEX="$RUNNER_TEMP/transform.vert.spv" \
          HORO_VULKAN_TRANSFORM_FRAGMENT="$RUNNER_TEMP/transform.frag.spv" \
          HORO_VULKAN_VERTEX_FIXTURE="$RUNNER_TEMP/preparation.vert.spv" \
          HORO_VULKAN_FRAGMENT_FIXTURE="$RUNNER_TEMP/preparation.frag.spv" \
          build/ci/tests/HoroRenderVulkanTests '[native-smoke]' --reporter junit --out build/ci/vulkan-shaders.xml
      - name: Test Vulkan commands on lavapipe
        if: runner.os == 'Linux'
        run: >-
          ctest --test-dir build/ci --no-tests=error --output-on-failure
          --timeout 90 -R '^HoroVulkanCommandExecutionSmoke$' --output-junit vulkan-commands.xml
      - name: Qualify the real Vulkan GUI and WSI pair
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          mkdir -p build/ci/vulkan-editor-evidence
          vulkaninfo --summary > build/ci/vulkan-editor-evidence/driver.txt
          cp "$RUNNER_TEMP/viewport-cook-tools/catalog.tsv" build/ci/vulkan-editor-evidence/
          xvfb-run -a ctest --test-dir build/ci --no-tests=error --verbose --parallel 1 --timeout 30 \
            -R '^(HoroEditorVulkanPresentationSmoke::|HoroShaderReflectionCookTests::)' \
            --output-junit vulkan-editor.xml 2>&1 | tee build/ci/vulkan-editor-evidence/native.log
          if grep -E 'Validation (Error|Warning)|VUID-' build/ci/vulkan-editor-evidence/native.log; then
            exit 1
          fi
      - name: Upload shader test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: shader-results-${{ runner.os }}
          path: |
            build/ci/*.xml
            build/ci/vulkan-editor-evidence/
            build/ci/native-editor-assets/
            build/ci/compile_commands.json
            build/ci/Testing/Temporary/LastTest.log
          if-no-files-found: warn

  directx-resources:
    name: D3D12 · Windows WARP resources
    needs: tooling
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      CC: cl
      CXX: cl
      HORO_COMPILER_LAUNCHER: sccache
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Setup build tools
        uses: ./.github/actions/setup-build-tools
      - name: Restore dependency and compiler caches
        uses: ./.github/actions/restore-native-cache
        with:
          profile: native-tests-v1
          mode: Debug
          max-size: 2G
      - name: Configure D3D12 tests
        run: >-
          cmake --preset ci-windows-debug -B build/ci-d3d12-resources
          -DHORO_BUILD_RENDER_VULKAN=OFF -DHORO_BUILD_PHYSICS_NATIVE=OFF
          -DHORO_BUILD_NAVIGATION_RECAST_DETOUR=OFF -DHORO_BUILD_INPUT_SDL3=OFF -DHORO_BUILD_EXAMPLES=OFF
      - name: Build D3D12 tests
        run: >-
          cmake --build build/ci-d3d12-resources --parallel 2
          --target HoroD3D12InitializationTests HoroD3D12ResourceTests
      - name: Test D3D12 initialization
        run: >-
          ctest --test-dir build/ci-d3d12-resources --output-on-failure --parallel 1 --no-tests=error
          --timeout 90 -R '^HoroD3D12InitializationTests::' --output-junit initialization.xml
      - name: Test D3D12 resources on WARP
        run: >-
          build/ci-d3d12-resources/tests/HoroD3D12ResourceTests.exe '[warp]'
          --reporter junit --out build/ci-d3d12-resources/warp.xml
      - name: Upload D3D12 test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: d3d12-resource-results
          path: |
            build/ci-d3d12-resources/*.xml
            build/ci-d3d12-resources/Testing/Temporary/LastTest.log
          if-no-files-found: warn

  test:
    name: Test · ${{ matrix.name }}
    # Same-run Linux MSL production is an explicit dependency. This intentionally
    # waits the complete shader matrix; unrelated Windows shader failure must
    # not skip native validation. Missing Linux data fails the Mac consumer.
    needs: [tooling, shaders]
    if: ${{ !cancelled() && needs.tooling.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      HORO_COMPILER_LAUNCHER: ${{ matrix.launcher }}
      HORO_LOG_LEVEL: debug
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux / GCC
            runner: ubuntu-24.04
            cc: gcc
            cxx: g++
            launcher: ccache
            preset: ci-linux-debug
          - name: macOS / Clang
            runner: macos-latest
            cc: clang
            cxx: clang++
            launcher: ccache
            preset: ci-macos-debug
          # The full Windows suite is still disabled. This preset builds the
          # existing focused contracts together in one headless composition.
          - name: Windows / MSVC
            runner: windows-2022
            cc: cl
            cxx: cl
            launcher: sccache
            preset: ci-windows-debug
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Setup build tools
        uses: ./.github/actions/setup-build-tools

      # Native publication requires a canonical parent. macOS TMPDIR may contain
      # /var aliases; establish the host temp root before tools and tests use it.
      - name: Canonicalize macOS temporary directory
        if: runner.os == 'macOS'
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import os
          import pathlib
          import tempfile

          root = pathlib.Path(tempfile.gettempdir()).resolve(strict=True)
          if not root.is_dir() or "\n" in str(root) or "\r" in str(root):
              raise RuntimeError("The temporary directory must be an existing canonical directory")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as environment:
              environment.write(f"TMPDIR={root}\n")
          PYTHON

      - name: Install native allocation verifier dependency
        id: qualification_python
        run: |
          verifier_python="$(python -c 'from pathlib import Path; import sys; print(Path(sys.executable).resolve().as_posix())')"
          echo "HORO_QUALIFICATION_PYTHON=$verifier_python" >> "$GITHUB_ENV"
          "$verifier_python" -m pip install --no-cache-dir --only-binary=:all: --no-deps defusedxml==0.7.1

      - name: Restore dependency and compiler caches
        id: cache
        uses: ./.github/actions/restore-native-cache
        with:
          # Preserve the existing main Debug checkpoint and build directory.
          # Compiler entries also validate the flags of auxiliary builds.
          profile: native-tests-v1
          dependency-profile: ${{ needs.tooling.outputs.network == 'true' && 'native-gns-v1' || '' }}
          mode: Debug
          max-size: 2G

      - name: Configure Debug
        run: cmake --preset "${{ matrix.preset }}" -DPython3_EXECUTABLE="$HORO_QUALIFICATION_PYTHON"

      - name: Build Debug
        id: debug_build
        run: cmake --build --preset "${{ matrix.preset }}"

      - name: Qualify OpenGL editor GUI composition with Mesa
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.debug_build.outcome == 'success' }}
        timeout-minutes: 2
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
        run: >-
          xvfb-run --auto-servernum --server-args="-screen 0 640x480x24"
          build/ci/tests/HoroEditorViewportOpenGLSmoke
          --reporter junit --out build/ci/opengl-editor-composition.xml

      - name: Receive exact same-run UI Metal qualification data
        if: runner.os == 'macOS'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ui-paint-metal-msl-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ui-paint-msl
      - name: Compile validated canonical UI shader with installed Apple offline tools
        if: runner.os == 'macOS'
        run: |
          python3 .github/scripts/ui_paint_fixture.py apple \
            --root "$RUNNER_TEMP/ui-paint-msl" --output "$RUNNER_TEMP/ui-paint-offline"
          printf 'HORO_UI_PAINT_METAL_FIXTURE=%s\n' "$RUNNER_TEMP/ui-paint-offline" >> "$GITHUB_ENV"
      - name: Configure Metal shader and presentation tests
        if: runner.os == 'macOS'
        run: >-
          cmake --preset ci-macos-debug -B build/ci-metal
          -DPython3_EXECUTABLE="$HORO_QUALIFICATION_PYTHON"
          -DHORO_ENABLE_GPU_SMOKE_TESTS=ON -DHORO_BUILD_RENDER_OPENGL=OFF
          -DHORO_BUILD_PHYSICS_NATIVE=OFF -DHORO_BUILD_NAVIGATION_RECAST_DETOUR=OFF

      - name: Build Metal shaders and tests
        if: runner.os == 'macOS'
        run: >-
          cmake --build build/ci-metal --parallel 2 --target
          HoroEditor HoroMetalShaderPreparationSmoke HoroMetalGraphExecutionSmoke
          HoroRenderDisplayTests HoroRenderFrontendTests HoroRenderBackendRegistryTests HoroRenderMetalTests
          HoroEditorViewportMetalSmoke HoroMetalUploadShutdownSmoke
          HoroRenderApiPublicHeaderConsumer HoroRenderFrontendPublicHeaderConsumer

      - name: Test Metal shaders and presentation
        if: runner.os == 'macOS'
        env:
          MTL_DEBUG_LAYER: '1'
        run: |
          cat > "$RUNNER_TEMP/metal-device.m" <<'OBJC'
          #import <Metal/Metal.h>
          int main(void) { @autoreleasepool { return MTLCreateSystemDefaultDevice() == nil ? 77 : 0; } }
          OBJC
          xcrun clang -fobjc-arc "$RUNNER_TEMP/metal-device.m" -framework Metal -framework Foundation -o "$RUNNER_TEMP/metal-device"
          status=0
          "$RUNNER_TEMP/metal-device" || status=$?
          if [ "$status" = 77 ]; then
            echo '::notice::Metal GPU tests skipped: this runner has no Metal device.'
          elif [ "$status" != 0 ]; then
            exit "$status"
          else
            ctest --test-dir build/ci-metal --parallel 1 --timeout 90 --output-on-failure --no-tests=error \
              -R '^(HoroRender(Display|Frontend|BackendRegistry|Metal)Tests::|HoroEditorViewportMetalSmoke::|HoroMetalUploadShutdownSmoke::|HoroEditorMetalFirstFrame$|HoroMetal(ShaderPreparation|GraphExecution)Smoke$)' \
              --output-junit ctest.xml
          fi

      # Debug audio is already in the build above. Release verifies NDEBUG
      # behavior using only the real-time audio group, on this same runner.
      - name: Configure Release audio checks
        run: cmake --preset ci-audio-release

      - name: Build Release audio checks
        id: release_build
        run: cmake --build --preset ci-audio-release

      # MSVC Debug container moves may allocate iterator proxies inside noexcept.
      # Keep the complete admission/callback allocation sweep mandatory in Release.
      - name: Build Windows Release allocation qualification
        id: mcp_release_build
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.release_build.outcome == 'success' }}
        run: cmake --build --preset ci-audio-release --target HoroMcpSessionTests HoroRuntimeSaveRestoreTransactionTests HoroPhysicsTests HoroSceneRuntimeConversionTests HoroRuntimeSaveSlotLifecycleTests HoroNavigationProjectSettingsTests HoroProjectCollisionSettingsTests HoroExtensionManagerTests HoroWorkspaceLayoutPersistenceTests

      - name: Configure navigation without Recast Detour
        if: runner.os == 'Linux'
        run: cmake --preset ci-navigation-null

      - name: Build navigation without Recast Detour
        id: navigation_build
        if: runner.os == 'Linux'
        run: cmake --build --preset ci-navigation-null

      - name: Configure navigation qualification without Physics
        if: runner.os == 'Linux'
        run: cmake --preset ci-navigation-physics-null

      - name: Build navigation qualification without Physics
        id: navigation_physics_null_build
        if: runner.os == 'Linux'
        run: cmake --build --preset ci-navigation-physics-null

      - name: Configure navigation qualification without both native providers
        if: runner.os == 'Linux'
        run: cmake --preset ci-navigation-providers-null

      - name: Build navigation qualification without both native providers
        id: navigation_providers_null_build
        if: runner.os == 'Linux'
        run: cmake --build --preset ci-navigation-providers-null

      - name: Install macOS network crypto library
        if: ${{ !cancelled() && runner.os == 'macOS' && needs.tooling.outputs.network == 'true' && steps.cache.outcome == 'success' }}
        run: |
          brew install openssl@3
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"

      - name: Configure headless network with GNS
        id: network_configure
        if: ${{ !cancelled() && needs.tooling.outputs.network == 'true' && steps.cache.outcome == 'success' }}
        run: cmake --preset ci-network-gns

      - name: Build headless network with GNS
        id: network_build
        if: ${{ !cancelled() && steps.network_configure.outcome == 'success' }}
        run: cmake --build --preset ci-network-gns

      - name: Verify network without production dependencies
        if: ${{ !cancelled() && runner.os == 'Linux' && needs.tooling.outputs.network == 'true' && steps.cache.outcome == 'success' }}
        run: cmake --preset ci-network-disabled

      # This opt-in private backend qualification runs on every platform in the
      # existing matrix. Injected native dispatch is not physical-device evidence.
      - name: Configure OpenXR native lifecycle qualification
        id: xr_configure
        if: ${{ !cancelled() && steps.cache.outcome == 'success' }}
        run: cmake --preset ci-xr-openxr

      - name: Build OpenXR lifecycle and header boundaries
        id: xr_build
        if: ${{ !cancelled() && steps.xr_configure.outcome == 'success' }}
        run: cmake --build --preset ci-xr-openxr

      - name: Verify OpenXR omitted target graph
        if: ${{ !cancelled() && steps.cache.outcome == 'success' }}
        run: cmake --preset ci-xr-disabled

      - name: Checkpoint main build caches
        if: ${{ !cancelled() && steps.debug_build.outcome == 'success' }}
        continue-on-error: true
        uses: ./.github/actions/save-native-cache
        with:
          compiler-key: ${{ steps.cache.outputs.compiler-key }}
          dependency-key: ${{ steps.cache.outputs.dependency-key }}
          dependency-hit: ${{ steps.cache.outputs.dependency-hit }}
          dependency-ready: ${{ steps.xr_configure.outcome == 'success' && (needs.tooling.outputs.network != 'true' || steps.network_configure.outcome == 'success') }}

      - name: Prepare Windows mixer allocation diagnostics
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.debug_build.outcome == 'success' }}
        shell: pwsh
        run: ./.github/scripts/stage_windows_symbols.ps1 -BinaryDirectory build/ci/tests

      - name: Diagnose Windows Character input allocation timeout
        if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.number == 3362 && runner.os == 'Windows' && steps.debug_build.outcome == 'success' }}
        timeout-minutes: 3
        shell: pwsh
        run: ./.github/scripts/diagnose_character_input_windows.ps1 -BuildDirectory build/ci

      - name: Upload Windows Character input stack text
        if: ${{ always() && github.event_name == 'pull_request' && github.event.pull_request.number == 3362 && runner.os == 'Windows' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: character-input-stack-text-Windows
          path: |
            build/ci/character-input-diagnostics/status.txt
            build/ci/character-input-diagnostics/threads.txt
            build/ci/character-input-diagnostics/ctest.xml
          if-no-files-found: warn
          retention-days: 3

      - name: Diagnose Windows PCG evaluator completion timeout
        if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.number == 3403 && runner.os == 'Windows' && steps.debug_build.outcome == 'success' }}
        timeout-minutes: 3
        shell: pwsh
        run: >-
          ./.github/scripts/diagnose_character_input_windows.ps1 -BuildDirectory build/ci
          -BinaryName HoroPCGTests.exe -EvidenceName pcg-evaluator-diagnostics
          -TestCase 'HoroPCGTests::PCG catalog work cost is checked before executable allocation admission'

      - name: Upload Windows PCG evaluator stack text
        if: ${{ always() && github.event_name == 'pull_request' && github.event.pull_request.number == 3403 && runner.os == 'Windows' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pcg-evaluator-stack-text-Windows
          path: |
            build/ci/pcg-evaluator-diagnostics/status.txt
            build/ci/pcg-evaluator-diagnostics/threads.txt
            build/ci/pcg-evaluator-diagnostics/ctest.xml
          if-no-files-found: warn
          retention-days: 3

      - name: Diagnose Windows Save lifecycle allocation boundary
        if: ${{ !cancelled() && ((github.event_name == 'pull_request' && github.head_ref == 'fix/HORO-2421_windows_save_allocation_capture') || (github.event_name == 'workflow_dispatch' && inputs.save_allocation_diagnostics == true)) && runner.os == 'Windows' && steps.debug_build.outcome == 'success' }}
        timeout-minutes: 3
        shell: pwsh
        run: >-
          ./.github/scripts/diagnose_character_input_windows.ps1 -BuildDirectory build/ci
          -BinaryName HoroRuntimeSaveSlotLifecycleTests.exe -EvidenceName save-lifecycle-stack
          -TestCase 'HoroRuntimeSaveSlotLifecycleTests::Lifecycle allocation failure after visibility preserves publication knowledge' -CaptureSymbolEvidence

      - name: Diagnose Windows Save retention allocation boundary
        if: ${{ !cancelled() && ((github.event_name == 'pull_request' && github.head_ref == 'fix/HORO-2421_windows_save_allocation_capture') || (github.event_name == 'workflow_dispatch' && inputs.save_allocation_diagnostics == true)) && runner.os == 'Windows' && steps.debug_build.outcome == 'success' }}
        timeout-minutes: 3
        shell: pwsh
        run: >-
          ./.github/scripts/diagnose_character_input_windows.ps1 -BuildDirectory build/ci
          -BinaryName HoroRuntimeSaveSlotLifecycleTests.exe -EvidenceName save-retention-stack
          -TestCase 'HoroRuntimeSaveSlotLifecycleTests::Retention allocation failure after selection preserves publication and binding ownership' -CaptureSymbolEvidence

      - name: Record Windows Save allocation diagnostic provenance
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.debug_build.outcome == 'success' }}
        shell: pwsh
        run: |
          $diagnosticDirectory = Join-Path $env:RUNNER_TEMP 'save-allocation-diagnostics'
          New-Item -ItemType Directory -Force -Path $diagnosticDirectory | Out-Null
          $files = @('build/ci/tests/HoroRuntimeSaveSlotLifecycleTests.exe',
                     'build/ci/tests/HoroRuntimeSaveSlotLifecycleTests.pdb') | ForEach-Object {
            $path = Join-Path $env:GITHUB_WORKSPACE $_
            if (Test-Path -LiteralPath $path -PathType Leaf) {
              @{ path = $path; sha256 = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash }
            } else {
              @{ path = $path; missing = $true }
            }
          }
          $tools = @('procdump64.exe', 'cdb.exe') | ForEach-Object {
            $tool = Get-Command $_ -CommandType Application -ErrorAction SilentlyContinue
            @{ name = $_; path = @($tool | ForEach-Object { $_.Source }) }
          }
          @{
            source = (git rev-parse HEAD)
            run = $env:GITHUB_RUN_ID
            attempt = $env:GITHUB_RUN_ATTEMPT
            files = @($files)
            toolsOnPath = @($tools)
            symbolMatch = 'unverified; file hashes alone do not establish executable/PDB matching'
            stackCapture = 'not performed; no debugger installation or attachment assumed'
            timeoutSeconds = 90
          } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $diagnosticDirectory 'provenance.json')

      - name: Diagnose Windows source edit allocation boundary
        if: ${{ !cancelled() && ((github.event_name == 'pull_request' && github.head_ref == 'fix/HORO-224_source_edit_allocation_recovery') || (github.event_name == 'workflow_dispatch' && inputs.source_allocation_diagnostics == true)) && runner.os == 'Windows' && steps.debug_build.outcome == 'success' }}
        timeout-minutes: 3
        shell: pwsh
        run: >-
          ./.github/scripts/diagnose_character_input_windows.ps1 -BuildDirectory build/ci
          -BinaryName HoroSourceFileOpenServiceTests.exe -EvidenceName source-edit-stack
          -TestCase 'HoroSourceFileOpenServiceTests::Cancelled and allocation-failed source operations do not publish partial roots' -CaptureSymbolEvidence

      - name: Test Debug
        if: ${{ !cancelled() && steps.debug_build.outcome == 'success' }}
        run: ctest --preset "${{ matrix.preset }}"

      - name: Test Release audio checks
        if: ${{ !cancelled() && steps.release_build.outcome == 'success' }}
        run: ctest --preset ci-audio-release

      - name: Test Windows Release MCP allocation qualification
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.mcp_release_build.outcome == 'success' }}
        run: >-
          ctest --test-dir build/ci-audio-release --parallel 1 --output-on-failure
          --no-tests=error --timeout 120 -R '^HoroMcpSessionTests::'
          --output-junit build/ci-audio-release/mcp-ctest.xml

      - name: Test Windows Release restore allocation qualification
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.mcp_release_build.outcome == 'success' }}
        run: >-
          ctest --test-dir build/ci-audio-release --parallel 1 --output-on-failure
          --no-tests=error --timeout 90 -R '^HoroRuntimeSaveRestoreTransactionTests::'
          --output-junit build/ci-audio-release/restore-ctest.xml

      - name: Test Windows Release Scene allocation qualification
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.mcp_release_build.outcome == 'success' }}
        shell: pwsh
        run: |
          $root = 'build/ci-audio-release'
          ctest --test-dir $root --show-only=json-v1 | Set-Content -LiteralPath "$root/scene-allocation-discovery.json" -Encoding utf8
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/dev.py qualify-scene --discovery "$root/scene-allocation-discovery.json" --regex-output "$root/scene-allocation-regex.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $pattern = Get-Content -Raw -LiteralPath "$root/scene-allocation-regex.txt"
          if (Test-Path -LiteralPath "$root/scene-allocation-ctest.xml") {
            Remove-Item -LiteralPath "$root/scene-allocation-ctest.xml" -ErrorAction Stop
          }
          ctest --test-dir $root --parallel 1 --output-on-failure --no-tests=error --timeout 90 -R $pattern --output-junit "scene-allocation-ctest.xml"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/dev.py qualify-scene --output-junit "$root/scene-allocation-ctest.xml"

      - name: Test Windows Release extension allocation qualification
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.mcp_release_build.outcome == 'success' }}
        shell: pwsh
        run: |
          $root = 'build/ci-audio-release'
          ctest --test-dir $root --show-only=json-v1 | Set-Content -LiteralPath "$root/extension-allocation-discovery.json" -Encoding utf8
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/dev.py qualify-extension --discovery "$root/extension-allocation-discovery.json" --regex-output "$root/extension-allocation-regex.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $pattern = Get-Content -Raw -LiteralPath "$root/extension-allocation-regex.txt"
          if (Test-Path -LiteralPath "$root/extension-allocation-ctest.xml") {
            Remove-Item -LiteralPath "$root/extension-allocation-ctest.xml" -ErrorAction Stop
          }
          ctest --test-dir $root --parallel 1 --output-on-failure --no-tests=error --timeout 90 --test-output-size-passed 65536 -R $pattern --output-junit "extension-allocation-ctest.xml"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/dev.py qualify-extension --output-junit "$root/extension-allocation-ctest.xml"

      - name: Test Windows Release Navigation settings allocation qualification
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.mcp_release_build.outcome == 'success' }}
        shell: pwsh
        run: |
          $root = 'build/ci-audio-release'
          ctest --test-dir $root --show-only=json-v1 | Set-Content -LiteralPath "$root/navigation-allocation-discovery.json" -Encoding utf8
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/dev.py qualify-scene --family navigation --discovery "$root/navigation-allocation-discovery.json" --regex-output "$root/navigation-allocation-regex.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $pattern = Get-Content -Raw -LiteralPath "$root/navigation-allocation-regex.txt"
          if (Test-Path -LiteralPath "$root/navigation-allocation-ctest.xml") {
            Remove-Item -LiteralPath "$root/navigation-allocation-ctest.xml" -ErrorAction Stop
          }
          ctest --test-dir $root --parallel 1 --output-on-failure --no-tests=error --timeout 90 -R $pattern --test-output-size-passed 16384 --output-junit "navigation-allocation-ctest.xml"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/dev.py qualify-scene --family navigation --output-junit "$root/navigation-allocation-ctest.xml"

      - name: Test Windows Release Collision settings allocation qualification
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.mcp_release_build.outcome == 'success' }}
        shell: pwsh
        run: |
          $root = 'build/ci-audio-release'
          ctest --test-dir $root --show-only=json-v1 | Set-Content -LiteralPath "$root/collision-allocation-discovery.json" -Encoding utf8
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/dev.py qualify-scene --family collision --discovery "$root/collision-allocation-discovery.json" --regex-output "$root/collision-allocation-regex.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
