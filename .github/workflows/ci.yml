name: Physics isolation benchmark

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: physics-isolation-benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CC: gcc
      CXX: g++
      HORO_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build-tools
      - uses: ./.github/actions/restore-native-cache
        with:
          profile: native-tests-v1
          mode: Debug
          max-size: 2G
          compiler-storage: registry
      - name: Configure the frozen candidate
        run: cmake --preset ci-linux-debug
      - name: Build only the unchanged Physics binary
        timeout-minutes: 7
        run: |
          cmake --build --preset ci-linux-debug --target HoroPhysicsTests --parallel 4
          ccache --show-stats
      - name: Compare suite and case isolation on the same runner
        timeout-minutes: 5
        run: python3 .github/scripts/benchmark_physics_isolation.py
      - name: Preserve benchmark evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: physics-isolation-benchmark
          path: build/physics-benchmark
          if-no-files-found: error
          retention-days: 7
