name: Cancel closed PR workflows

on:
  pull_request_target:
    types: [closed]

permissions:
  contents: read
  actions: write

jobs:
  cancel:
    name: Cancel obsolete PR runs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Execute only the trusted main branch, never the PR head.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: main
          persist-credentials: false

      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const cancelClosedPrRuns = require('./.github/scripts/cancel_closed_pr_runs.js');
            await cancelClosedPrRuns({ github, context, core });
