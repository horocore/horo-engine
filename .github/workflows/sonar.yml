name: SonarCloud

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonar-${{ github.workflow }}-${{ github.ref }}
  # Let the active main scan finish and refresh SonarCloud's branch cache.
  # GitHub replaces a pending main run with the latest merge, so a burst needs
  # at most the active scan and one follow-up. Supersede stale PR scans.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  viewport-assets:
    name: Canonical Vulkan viewport assets
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    outputs:
      artifact-id: ${{ steps.assets.outputs.artifact-id }}
    env:
      CC: gcc
      CXX: g++
      HORO_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build-tools
      - uses: ./.github/actions/restore-native-cache
        with:
          profile: native-tests-v1
          mode: Debug
          max-size: 2G
      - name: Configure the qualified offline cook
        run: >-
          cmake --preset ci-linux-debug
          -DHORO_BUILD_XR_OPENXR=ON -DHORO_BUILD_RENDER_VULKAN=ON
          -DHORO_ENABLE_GPU_SMOKE_TESTS=ON -DHORO_BUILD_EDITOR_GUI=ON
          -DHORO_BUILD_RENDER_OPENGL=OFF -DHORO_BUILD_RENDER_METAL=OFF
          -DHORO_BUILD_AUDIO_SDL3=OFF -DHORO_ENABLE_OPENTELEMETRY=OFF
          -DHORO_BUILD_PHYSICS_NATIVE=OFF -DHORO_BUILD_NAVIGATION_RECAST_DETOUR=OFF
      - name: Build only the owning canonical cook
        run: cmake --build build/ci --target HoroEditorVulkanShaderCook --parallel 2
      - uses: ./.github/actions/cook-vulkan-viewport
        with:
          asset-root: ${{ github.workspace }}/build/ci/native-editor-assets
      - name: Upload data-only same-run viewport assets
        id: assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sonar-viewport-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          path: build/ci/native-editor-assets/

  sonar:
    name: SonarCloud
    needs: viewport-assets
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_DIR: ${{ github.workspace }}/.sonar/ccache
      CCACHE_COMPRESS: 'true'
      CCACHE_MAXSIZE: 2G
      SONAR_USER_HOME: ${{ github.workspace }}/.sonar/user-home
      SONAR_SCANNER_VERSION: '7.2.0.5079'
      HORO_COMPILER_LAUNCHER: ccache

    steps:
      - name: Checkout source and Git history
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check Sonar authentication
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo '::error::Set the repository Actions secret SONAR_TOKEN before running SonarCloud.'
            exit 1
          fi

      - name: Restore FetchContent dependencies
        id: deps
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            .cmake/fetchcontent/*-src
            .cmake/fetchcontent/*-subbuild
          # Cache fetched sources and download metadata, never coverage objects or build trees.
          key: sonar-v3-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('cmake/Dependencies.cmake', 'cmake/Horo*Dependency.cmake') }}
          restore-keys: |
            sonar-v3-deps-${{ runner.os }}-${{ runner.arch }}-
            sonar-v2-deps-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore compiler cache
        id: compiler
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ${{ github.workspace }}/.sonar/ccache
          key: sonar-v2-gcc-${{ runner.os }}-${{ runner.arch }}-main-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            sonar-v2-gcc-${{ runner.os }}-${{ runner.arch }}-main-

      - name: Restore Sonar scanner downloads
        id: scanner_cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ${{ github.workspace }}/.sonar/user-home/cache
            ${{ github.workspace }}/.sonar/user-home/sonar-scanner-${{ env.SONAR_SCANNER_VERSION }}-linux-x64
          key: sonar-v3-scanner-${{ env.SONAR_SCANNER_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Setup build tools
        uses: ./.github/actions/setup-build-tools

      - name: Install coverage tools
        run: |
          python3 -m venv /tmp/horo-coverage
          /tmp/horo-coverage/bin/pip install --disable-pip-version-check --no-cache-dir \
            coverage==7.6.10 fastcov==1.17 pytest==8.3.4 defusedxml==0.7.1

      - name: Configure instrumented Debug build
        run: cmake --preset sonar -DPython3_EXECUTABLE=/tmp/horo-coverage/bin/python

      - name: Build instrumented targets
        id: build
        run: |
          ccache --zero-stats
          cmake --build --preset sonar
          ccache --show-stats

      # Checkpoint build inputs before coverage and analysis. A later scan timeout
      # must not discard the dependency and compiler work needed by the next run.
      - name: Save FetchContent dependencies
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && steps.build.outcome == 'success' && steps.deps.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            .cmake/fetchcontent/*-src
            .cmake/fetchcontent/*-subbuild
          key: ${{ steps.deps.outputs.cache-primary-key }}

      - name: Save compiler cache
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && steps.build.outcome == 'success' && steps.compiler.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ${{ github.workspace }}/.sonar/ccache
          key: ${{ steps.compiler.outputs.cache-primary-key }}

      - name: Require the producer artifact identity
        env:
          VIEWPORT_ARTIFACT_ID: ${{ needs.viewport-assets.outputs.artifact-id }}
        run: '[[ "$VIEWPORT_ARTIFACT_ID" =~ ^[0-9]+$ ]]'

      - name: Download this run's viewport data
        uses: actions/download-artifact@d3f86a106a0bac45f2f8406bd4850e7943e2c8df
        with:
          artifact-ids: ${{ needs.viewport-assets.outputs.artifact-id }}
          path: build/sonar/native-editor-assets
          merge-multiple: true

      - name: Verify viewport source run catalog and data digests
        run: |
          set -euo pipefail
          asset_root="$GITHUB_WORKSPACE/build/sonar/native-editor-assets"
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          HORO_VIEWPORT_SOURCE_TREE="$(git rev-parse 'HEAD^{tree}')" \
            python3 .github/scripts/viewport_asset_bundle.py verify --root "$asset_root"
          printf 'HORO_EDITOR_VULKAN_ASSET_ROOT=%s\n' "$asset_root" >> "$GITHUB_ENV"

      - name: Run C++ coverage tests
        run: xvfb-run -a ctest --preset sonar

      - name: Run Python coverage tests
        run: |
          /tmp/horo-coverage/bin/coverage run --source=scripts -m pytest tests/python --quiet
          /tmp/horo-coverage/bin/coverage xml -o build/sonar/python-coverage.xml

      - name: Collect fastcov line coverage
        id: coverage
        run: bash .github/scripts/collect_sonar_coverage.sh

      - name: Upload coverage evidence
        if: ${{ !cancelled() && steps.coverage.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coverage-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          path: |
            build/sonar/coverage.xml
            build/sonar/fastcov-coverage.json

      - name: Install cached Sonar scanner
        run: bash .github/scripts/install_sonar_scanner.sh

      - name: Analyze code and wait for Quality Gate
        id: scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          "$SONAR_USER_HOME/sonar-scanner-$SONAR_SCANNER_VERSION-linux-x64/bin/sonar-scanner" \
            -Dsonar.organization=horocore \
            -Dsonar.projectKey=horocore_horo-engine \
            -Dsonar.sourceEncoding=UTF-8 \
            -Dsonar.cfamily.compile-commands=build/sonar/compile_commands.json \
            -Dsonar.coverageReportPaths=build/sonar/coverage.xml \
            -Dsonar.python.coverage.reportPaths=build/sonar/python-coverage.xml \
            -Dsonar.cfamily.analysisCache.mode=server \
            -Dsonar.qualitygate.wait=true \
            -Dsonar.qualitygate.timeout=300

      # Scanner binaries/plugins change only with the pinned scanner or server
      # version. Keep one main-scoped copy for PR restores; CFamily analysis
      # results live on SonarCloud and never compete for Actions cache space.
      - name: Save Sonar scanner downloads
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && (steps.scan.outcome == 'success' || steps.scan.outcome == 'failure') && steps.scanner_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ${{ github.workspace }}/.sonar/user-home/cache
            ${{ github.workspace }}/.sonar/user-home/sonar-scanner-${{ env.SONAR_SCANNER_VERSION }}-linux-x64
          key: ${{ steps.scanner_cache.outputs.cache-primary-key }}
