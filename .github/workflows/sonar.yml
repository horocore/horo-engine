name: SonarCloud

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonar-${{ github.workflow }}-${{ github.ref }}
  # Let the active main scan finish and refresh SonarCloud's branch cache.
  # GitHub replaces a pending main run with the latest merge, so a burst needs
  # at most the active scan and one follow-up. Supersede stale PR scans.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sonar:
    name: SonarCloud
    runs-on: ubuntu-24.04
    # A cold build, coverage pass, and CFamily scan can exceed 40 minutes. Keep a
    # bounded margin so the scan and Quality Gate wait can finish and publish the
    # server-side analysis cache instead of timing out at the scan boundary.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_DIR: ${{ github.workspace }}/.sonar/ccache
      CCACHE_COMPRESS: 'true'
      CCACHE_MAXSIZE: 2G
      CACHE_SCOPE: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}
      FETCHCONTENT_BASE_DIR: ${{ github.workspace }}/.cmake/fetchcontent
      SONAR_USER_HOME: ${{ github.workspace }}/.sonar/user-home

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check Sonar authentication
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo '::error::Set the repository Actions secret SONAR_TOKEN before running SonarCloud.'
            exit 1
          fi

      - name: Restore FetchContent dependencies
        id: deps
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            .cmake/fetchcontent
          # Only dependency declarations affect this cache. Hashing every
          # CMakeLists.txt created a new ~925 MB cache for unrelated target
          # changes and crowded out the CFamily analysis cache.
          key: sonar-v2-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('cmake/Dependencies.cmake', 'cmake/Horo*Dependency.cmake') }}
          restore-keys: |
            sonar-v2-deps-${{ runner.os }}-${{ runner.arch }}-
            sonar-v1-deps-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore compiler cache
        id: compiler
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ${{ github.workspace }}/.sonar/ccache
          key: sonar-v2-gcc-${{ runner.os }}-${{ runner.arch }}-${{ env.CACHE_SCOPE }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            sonar-v2-gcc-${{ runner.os }}-${{ runner.arch }}-${{ env.CACHE_SCOPE }}-
            sonar-v2-gcc-${{ runner.os }}-${{ runner.arch }}-main-
            sonar-v1-gcc-${{ runner.os }}-${{ runner.arch }}-refs/heads/main-

      - name: Restore Sonar scanner downloads
        id: scanner_cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ${{ github.workspace }}/.sonar/user-home/cache
            ${{ github.workspace }}/.sonar/user-home/sonar-scanner-7.2.0.5079-linux-x64
          key: sonar-v3-scanner-7.2.0.5079-${{ runner.os }}-${{ runner.arch }}

      - name: Report cache restores
        env:
          COMPILER_CACHE_KEY: ${{ steps.compiler.outputs.cache-matched-key }}
          DEPENDENCY_CACHE_KEY: ${{ steps.deps.outputs.cache-matched-key }}
          SCANNER_CACHE_KEY: ${{ steps.scanner_cache.outputs.cache-matched-key }}
        run: |
          echo "FetchContent cache: ${DEPENDENCY_CACHE_KEY:-cold start}"
          echo "Compiler cache: ${COMPILER_CACHE_KEY:-cold start}"
          echo "Scanner downloads cache: ${SCANNER_CACHE_KEY:-cold start}"
          echo 'CFamily analysis cache: SonarCloud server (main branch; PRs use target branch)'

      - name: Install Linux dependencies
        id: install
        run: |
          if ! sudo apt-get update; then
            sudo rm -f /etc/apt/sources.list.d/azure-cli.list /etc/apt/sources.list.d/microsoft-prod.list
            sudo apt-get update
          fi
          sudo apt-get install -y --no-install-recommends \
            ninja-build ccache unzip python3-venv xvfb xauth libssl-dev \
            libwayland-dev wayland-protocols libxkbcommon-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libxext-dev libxss-dev libxtst-dev libxxf86vm-dev \
            libgl1-mesa-dev libglu1-mesa-dev
          python3 -m venv /tmp/horo-gcovr
          /tmp/horo-gcovr/bin/pip install --disable-pip-version-check --no-cache-dir \
            coverage==7.6.10 gcovr==8.6 pytest==8.3.4

      - name: Configure and build
        id: build
        run: |
          cmake -S . -B build/sonar -G Ninja -DBUILD_TESTING=ON \
            -DFETCHCONTENT_BASE_DIR="$FETCHCONTENT_BASE_DIR" \
            -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_C_FLAGS_DEBUG="--coverage -fprofile-abs-path" \
            -DCMAKE_CXX_FLAGS_DEBUG="--coverage -fprofile-abs-path" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DHORO_ENABLE_EDITOR=ON \
            -DHORO_ENABLE_IMGUI_UI_TESTS=ON \
            -DHORO_ENABLE_GPU_SMOKE_TESTS=ON \
            -DHORO_BUILD_RENDER_VULKAN=ON \
            -DHORO_ENABLE_TELEMETRY=ON \
            -DHORO_ENABLE_OPENTELEMETRY=ON \
            -DHORO_BUILD_NETWORK_GNS=ON
          cmake --build build/sonar --parallel

      # Checkpoint build inputs before coverage and analysis. A later scan timeout
      # must not discard the dependency and compiler work needed by the next run.
      - name: Save FetchContent dependencies
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.deps.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            .cmake/fetchcontent
          key: ${{ steps.deps.outputs.cache-primary-key }}

      - name: Save compiler cache
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.compiler.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ${{ github.workspace }}/.sonar/ccache
          key: ${{ steps.compiler.outputs.cache-primary-key }}

      - name: Test and collect coverage
        id: coverage
        run: |
          xvfb-run -a ctest --test-dir build/sonar --output-on-failure -LE 'gui|editor'
          xvfb-run -a build/sonar/tests/HoroEditorPresentationTests
          xvfb-run -a build/sonar/tests/HoroEditorUiAutomationTests '~[native]'
          xvfb-run -a build/sonar/tests/HoroSourceFileOpenServiceTests
          xvfb-run -a build/sonar/tests/HoroEditorWorkspaceControllerTests
          /tmp/horo-gcovr/bin/coverage run --source=scripts -m pytest tests/python --quiet
          /tmp/horo-gcovr/bin/coverage xml -o build/sonar/python-coverage.xml
          gcovr_started=$SECONDS
          /tmp/horo-gcovr/bin/gcovr --sonarqube build/sonar/coverage.xml \
            -j 0 \
            --sonarqube-metric line \
            --root "$GITHUB_WORKSPACE" \
            --filter "$GITHUB_WORKSPACE/include" \
            --filter "$GITHUB_WORKSPACE/src" \
            --filter "$GITHUB_WORKSPACE/apps/common" \
            --exclude-throw-branches \
            --exclude-unreachable-branches \
            --exclude-noncode-lines \
            --gcov-ignore-parse-errors=negative_hits.warn_once_per_file \
            build/sonar
          echo "gcovr completed in $((SECONDS - gcovr_started))s"
          ccache --show-stats

      - name: SonarCloud scan
        id: scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mkdir -p "$SONAR_USER_HOME"
          if [ ! -x "$SONAR_USER_HOME/sonar-scanner-7.2.0.5079-linux-x64/bin/sonar-scanner" ]; then
            curl --proto "=https" --proto-redir "=https" --retry 3 -fsSL https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-7.2.0.5079-linux-x64.zip -o /tmp/sonar-scanner.zip
            unzip -q /tmp/sonar-scanner.zip -d "$SONAR_USER_HOME"
          fi
          "$SONAR_USER_HOME/sonar-scanner-7.2.0.5079-linux-x64/bin/sonar-scanner" \
            -Dsonar.organization=horocore \
            -Dsonar.projectKey=horocore_horo-engine \
            -Dsonar.sourceEncoding=UTF-8 \
            -Dsonar.cfamily.compile-commands=build/sonar/compile_commands.json \
            -Dsonar.coverageReportPaths=build/sonar/coverage.xml \
            -Dsonar.python.coverage.reportPaths=build/sonar/python-coverage.xml \
            -Dsonar.cfamily.analysisCache.mode=server \
            -Dsonar.qualitygate.wait=true \
            -Dsonar.qualitygate.timeout=300

      # Scanner binaries/plugins change only with the pinned scanner or server
      # version. Keep one main-scoped copy for PR restores; CFamily analysis
      # results live on SonarCloud and never compete for Actions cache space.
      - name: Save Sonar scanner downloads
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && (steps.scan.outcome == 'success' || steps.scan.outcome == 'failure') && steps.scanner_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ${{ github.workspace }}/.sonar/user-home/cache
            ${{ github.workspace }}/.sonar/user-home/sonar-scanner-7.2.0.5079-linux-x64
          key: ${{ steps.scanner_cache.outputs.cache-primary-key }}
