name: Public compiler checkpoints

on:
  workflow_run:
    workflows: [CI, SonarCloud]
    branches: [main]
    types: [completed]
  # Checkpoints are saved before tests. Export while a long scan is still live.
  schedule:
    - cron: '9,39 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-compiler-checkpoints
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.repository == 'horocore/horo-engine' && github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.event == 'push'))
    permissions:
      contents: read
      packages: write
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - runner: ubuntu-24.04
            profile: sonar
            cc: gcc
            cxx: g++
          - runner: ubuntu-24.04
            profile: native
            cc: gcc
            cxx: g++
          - runner: macos-latest
            profile: native
            cc: clang
            cxx: clang++
          - runner: windows-2022
            profile: native
            cc: cl
            cxx: cl
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    defaults:
      run:
        shell: bash
    steps:
      # Always reviewed main code. Never execute the triggering run's artifacts.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: main
          persist-credentials: false
      - uses: ./.github/actions/setup-build-tools
        if: matrix.profile == 'native'
      - uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6
        with:
          version: 1.3.0
      - name: Restore native checkpoint without compiling
        if: matrix.profile == 'native'
        id: native
        uses: ./.github/actions/restore-native-cache
        with:
          profile: native-tests-v1
          mode: Debug
          max-size: 2G
          compiler-only: 'true'
          external-cache: 'false'
      - name: Restore instrumented checkpoint without compiling
        if: matrix.profile == 'sonar'
        id: sonar
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ github.workspace }}/.sonar/ccache
          key: sonar-v2-gcc-${{ runner.os }}-${{ runner.arch }}-main-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            sonar-v2-gcc-${{ runner.os }}-${{ runner.arch }}-main-
      - name: Stop cache server before taking an idle snapshot
        if: runner.os == 'Windows'
        run: sccache --stop-server
      - name: Publish only an existing main checkpoint
        env:
          SOURCE_KEY: ${{ steps.native.outputs.compiler-matched-key || steps.sonar.outputs.cache-matched-key }}
          HORO_PACKAGE_TOKEN: ${{ github.token }}
        run: |
          if [[ -z "$SOURCE_KEY" ]]; then
            echo 'No compatible Actions checkpoint; skip export without starting a build'
          else
            python3 .github/scripts/compiler_registry.py publish --key "$SOURCE_KEY"
          fi
