name: Prefab Foundation Windows

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Format & Tooling Check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Tooling
        run: "pip install --no-cache-dir --only-binary=:all: pytest==8.3.4 clang-format==19.1.7"

      - name: Diagnostics Check
        run: python3 scripts/dev.py doctor

      - name: Verify C++ Formatting
        run: python3 scripts/dev.py format --check

      - name: Run Python Runner Tests
        run: pytest tests/python/

  prefab-foundation-windows:
    name: Prefab Foundation · Windows / MSVC
    runs-on: windows-2022
    needs: [format]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756

      - uses: seanmiddleditch/gha-setup-ninja@3b1f8f94a2f8254bd26914c4ab9474d4f0015f67

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.17.0

      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ github.workspace }}/.cmake/fetchcontent
          key: fetchcontent-prefab-windows-${{ hashFiles('**/CMakeLists.txt', 'cmake/**') }}
          restore-keys: fetchcontent-prefab-windows-

      - name: Build and test prefab foundation contracts
        shell: bash
        run: |
          cmake -S . -B build/prefab-windows -G Ninja \
            -DBUILD_TESTING=ON \
            -DHORO_BUILD_EDITOR_GUI=OFF \
            -DHORO_BUILD_RENDER_OPENGL=OFF \
            -DHORO_ENABLE_OPENTELEMETRY=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded
          cmake --build build/prefab-windows --target HoroPrefabTests HoroAssetRegistryTests --parallel 2
          ctest --test-dir build/prefab-windows -R '^(HoroPrefabTests|HoroAssetRegistryTests)::' --output-on-failure
        env:
          CC: cl
          CXX: cl
          FETCHCONTENT_BASE_DIR: ${{ github.workspace }}/.cmake/fetchcontent
          SCCACHE_GHA_ENABLED: 'true'
          SCCACHE_IGNORE_SERVER_IO_ERROR: '1'
