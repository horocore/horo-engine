name: Cook canonical Vulkan viewport
description: Run the reviewed Ubuntu26 locked-tool protocol and publish data-only provenance.
inputs:
  build-directory:
    description: Build containing the owning offline cook executable
    default: build/ci
  asset-root:
    description: Absolute destination for the data-only bundle
    required: true
runs:
  using: composite
  steps:
    - name: Cook with locked archive and executable identities
      shell: bash
      env:
        COOK_BUILD_DIR: ${{ inputs.build-directory }}
        COOK_ASSET_ROOT: ${{ inputs.asset-root }}
      run: |
        set -euo pipefail
        tool_root="$RUNNER_TEMP/viewport-cook-tools"
        asset_root="$COOK_ASSET_ROOT"
        mkdir -p "$tool_root" "$asset_root/shaders/editor"
        "$COOK_BUILD_DIR/apps/HoroEditorVulkanShaderCook" --describe-tools > "$tool_root/catalog.tsv"
        count=0
        declare -a executables
        while IFS=$'\t' read -r role source archive_digest executable_digest executable_relative_path; do
          [[ "$source" == https://* ]]
          archive="$tool_root/$role.archive"
          destination="$tool_root/$role"
          mkdir -p "$destination"
          curl --fail --location --retry 3 --output "$archive" "$source"
          printf '%s  %s\n' "${archive_digest#sha256:}" "$archive" | sha256sum --check
          case "$role" in
            0) tar -xzf "$archive" -C "$destination" ;;
            1) dpkg-deb --extract "$archive" "$destination" ;;
            2) dpkg-deb --extract "$archive" "$destination" ;;
            *) exit 1 ;;
          esac
          executable="$(python3 scripts/project.py verify-shader-tool --root "$destination" \
            --relative-path "$executable_relative_path" --sha256 "$executable_digest")"
          executables[$role]="$executable"
          count=$((count + 1))
        done < "$tool_root/catalog.tsv"
        [[ "$count" == 3 ]]
        export LD_LIBRARY_PATH="$(dirname "${executables[0]}")/../lib:${LD_LIBRARY_PATH:-}"
        "$COOK_BUILD_DIR/apps/HoroEditorVulkanShaderCook" assets/shaders/editor/viewport.hlsl \
          "$asset_root/shaders/editor/viewport-vulkan" "$RUNNER_TEMP/viewport-cook-scratch" \
          "${executables[0]}" "${executables[1]}" "${executables[2]}"
        cp "$tool_root/catalog.tsv" "$asset_root/catalog.tsv"
        [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
        HORO_VIEWPORT_SOURCE_TREE="$(git rev-parse 'HEAD^{tree}')" \
          python3 .github/scripts/viewport_asset_bundle.py create --root "$asset_root"
