name: Setup build tools
description: Install the native toolchain and Linux display dependencies used by CI and coverage
runs:
  using: composite
  steps:
    - name: Install Linux build and display libraries
      if: runner.os == 'Linux'
      shell: bash
      run: bash .github/scripts/install_linux_build_dependencies.sh

    - name: Install macOS build tools
      if: runner.os == 'macOS'
      shell: bash
      run: brew install ninja

    - name: Setup MSVC
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756

    - name: Setup Windows Ninja
      if: runner.os == 'Windows'
      uses: seanmiddleditch/gha-setup-ninja@3b1f8f94a2f8254bd26914c4ab9474d4f0015f67
