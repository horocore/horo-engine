name: Horo Extension

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extension:
    name: Extension · ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
          - platform: macos-arm64
            runner: macos-15
          - platform: macos-x64
            runner: macos-15-intel
          - platform: windows-x64
            runner: windows-2022
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.7'
      - name: Install pinned CMake
        run: python -m pip install --no-cache-dir --no-deps cmake==3.31.6
      - name: Build, validate, test, package and verify
        run: >-
          python .horo/ci/bootstrap.py
          --lock .horo/extension-ci.lock.json
          --platform ${{ matrix.platform }}
          --project .
          --output ci-artifacts
          --repository ${{ github.repository }}
          --commit ${{ github.sha }}
      - name: Publish attributable package and evidence
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75bde44955e1dbb3e9c9b7d2113
        with:
          name: horo-extension-${{ matrix.platform }}-${{ github.sha }}
          path: ci-artifacts/
          if-no-files-found: error
          retention-days: 14
